- id: 9950b9a2-8747-4103-3aa0-132d6588d754
  name: 'Nmcap.exe - Start capture on all network adapters and save to specified .cap
    (circular) file.

    Optionally, one can add:

    - `/TerminateWhen /TimeAfter 30 seconds` to auto-terminate after a relative times
    (e.g. 30 seconds);

    - `/TerminateWhen /Time 04:52:00 AM 9/17/2025` to auto-terminate after a specific
    date/time;

    - `/TerminateWhen /KeyPress x` to terminate when a specific key is pressed.

    '
  description: 'Start capture on all network adapters and save to specified .cap (circular)
    file.

    Optionally, one can add:

    - `/TerminateWhen /TimeAfter 30 seconds` to auto-terminate after a relative times
    (e.g. 30 seconds);

    - `/TerminateWhen /Time 04:52:00 AM 9/17/2025` to auto-terminate after a specific
    date/time;

    - `/TerminateWhen /KeyPress x` to terminate when a specific key is pressed.

    '
  tactic: credential-access
  technique:
    attack_id: T1040
    name: System Binary Proxy Execution
  platforms:
    windows:
      cmd:
        command: 'nmcap.exe /network * /capture /file #{host.dir.temp}'
  singleton: true
  privilege: User
  repeatable: false
  buckets:
