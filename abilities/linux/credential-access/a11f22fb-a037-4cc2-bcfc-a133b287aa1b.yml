- id: a11f22fb-a037-4cc2-bcfc-a133b287aa1b
  name: Access Drone CI Config File
  description: Find Drone CI configuration files (.drone.yml), which may contain credentials,
    secrets, or sensitive environment variables used in Drone CI/CD pipelines.
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    linux:
      sh:
        command: find / -name '.drone.yml' -type f -exec sh -c 'echo "=== $1 ==="
          >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt' _ {} \; 2>/dev/null
        cleanup: rm -f /tmp/creds.txt
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1552.001
  - atomic-red-team
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      file_path:
        description: Path to search
        type: string
        default: /
      filename:
        description: Name of file to search for
        type: string
        default: .drone.yml
      optional_flags:
        description: optional flags passed into find that should be ran
        type: string
        default: -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \;
    technique_created: '2020-02-04T12:52:13.006Z'
    atomic_guid: a11f22fb-a037-4cc2-bcfc-a133b287aa1b
    import_timestamp: '2026-09-06T06:52:20.416708Z'
