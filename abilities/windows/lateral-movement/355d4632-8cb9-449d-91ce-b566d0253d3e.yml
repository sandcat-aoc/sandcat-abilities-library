- id: 355d4632-8cb9-449d-91ce-b566d0253d3e
  name: RDP to Remote Host
  description: Attempt an RDP session via the Remote Desktop Client (mstsc) to an
    arbitrary remote host.
  tactic: lateral-movement
  technique:
    attack_id: T1021.001
    name: 'Remote Services: Remote Desktop Protocol'
  platforms:
    windows:
      psh:
        command: $Server = "127.0.0.1"; $User = if ("#{domain}") { "#{domain}\$ENV:USERNAME"
          } else { "$ENV:USERNAME" }; $Password = "1password2!"; cmdkey /generic:TERMSRV/$Server
          /user:$User /pass:$Password; mstsc /v:$Server; echo "RDP connection attempted"
        cleanup: $p=Tasklist /svc /fi "IMAGENAME eq mstsc.exe" /fo csv | convertfrom-csv;
          if(-not ([string]::IsNullOrEmpty($p.PID))) { Stop-Process -Id $p.PID };
          cmdkey /delete:TERMSRV/#{target_host}| Out-Null
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1021.001
  - lateral-movement
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      target_host:
        description: IP address or hostname of the remote host to RDP into.
        type: string
        default: 127.0.0.1
      domain:
        description: Domain of the account. Leave blank to use a local account (username
          only).
        type: string
        default: ''
      username:
        description: Username argument default %username%
        type: string
        default: $ENV:USERNAME
      password:
        description: Password
        type: string
        default: 1password2!
    technique_created: '2020-02-11T18:23:26.059Z'
    atomic_guid: 355d4632-8cb9-449d-91ce-b566d0253d3e
    import_timestamp: '2026-09-06T06:52:06.186916Z'
