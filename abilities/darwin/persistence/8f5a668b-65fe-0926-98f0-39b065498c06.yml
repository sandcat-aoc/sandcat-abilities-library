- id: 8f5a668b-65fe-0926-98f0-39b065498c06
  name: pwpolicy - Take over an existing account by setting its password
  description: -setpassword writes a new password for an account. As root it works directly; with -a it
    authenticates as another administrator. The out-of-band change does not resynchronise the login keychain
    or a Secure Token protected FileVault credential, so the account can authenticate at loginwindow while
    its keychain stays locked with the old password.
  tactic: persistence
  technique:
    attack_id: T1547.001
    name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
  platforms:
    darwin:
      sh:
        command: sudo pwpolicy -u <TARGET_USER> -setpassword
  singleton: false
  privilege: Elevated
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - pwpolicy
  - persistence
  version: '1.0'
  author: LOOBins Project
