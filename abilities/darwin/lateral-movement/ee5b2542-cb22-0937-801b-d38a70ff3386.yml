- id: ee5b2542-cb22-0937-801b-d38a70ff3386
  name: osascript - Remote command execution over SSH using osascript do shell script
  description: osascript's 'do shell script' handler can be invoked over an SSH session to execute arbitrary
    shell commands on a remote macOS host. This technique requires only SSH access to the target. Unlike
    when using Remote Apple Events (eppc://) with osascript, it does not require port 3031 to be accessible,
    Remote Apple Events to be enabled, or the target application to be running. This makes it viable against
    hosts where eppc:// is blocked by the firewall or disabled in System Settings, and against headless
    or server Macs that have no active GUI session.
  tactic: lateral-movement
  technique:
    attack_id: T1059.002
    name: 'Command and Scripting Interpreter: AppleScript'
  platforms:
    darwin:
      sh:
        command: 'ssh -i key.pem user@<TARGET_IP> ''bash -s'' <<''EOF''

          osascript -e ''do shell script "id"''

          EOF'
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - osascript
  - lateral-movement
  version: '1.0'
