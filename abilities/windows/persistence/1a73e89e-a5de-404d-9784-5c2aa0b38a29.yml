- id: 1a73e89e-a5de-404d-9784-5c2aa0b38a29
  name: Turla Topinambour Dropper and Scheduled Task Persistence
  description: 'Emulates the dropper behavior of Turla''s Topinambour. Uses inline
    C# compiled via

    Add-Type to replicate the dropper''s unpack_p() and make_some_noise() functions.
    unpack_p() drops a

    benign stand-in executable to %LOCALAPPDATA%\VirtualStore\certcheck.exe, and make_some_noise()
    creates

    a scheduled task named VerifiedPublisherCertCheck that runs certcheck.exe every
    30 minutes.


    Reference: https://securelist.com/turla-renews-its-arsenal-with-topinambour/91687/'
  tactic: persistence
  technique:
    attack_id: T1053.005
    name: 'Scheduled Task/Job: Scheduled Task'
  platforms:
    windows:
      psh:
        command: '$dropPath = "$env:LOCALAPPDATA\VirtualStore\certcheck.exe"; if ((Test-Path
          "$env:TEMP\T1053005_certcheck_backup.exe") -or !(Test-Path $dropPath)) {
          exit 0 } else { exit 1 }; then : ; else Copy-Item "$env:LOCALAPPDATA\VirtualStore\certcheck.exe"
          "$env:TEMP\T1053005_certcheck_backup.exe" -Force; fi; Add-Type @''; using
          System;; using System.Diagnostics;; using System.IO;; public class TopinambourDropper
          {; public static void unpack_p(string sourceExe) {; string dropPath = Path.Combine(Environment.GetEnvironmentVariable("LOCALAPPDATA"),
          "VirtualStore", "certcheck.exe");; Directory.CreateDirectory(Path.GetDirectoryName(dropPath));;
          File.Copy(sourceExe, dropPath, true);; }; public static void make_some_noise()
          {; ProcessStartInfo startInfo = new ProcessStartInfo("cmd", "/c schtasks
          /create /SC MINUTE /MO 30 /TR \"%localappdata%\\VirtualStore\\certcheck.exe\"
          /TN VerifiedPublisherCertCheck /F"); {; CreateNoWindow = true,; UseShellExecute
          = false; };; Process.Start(startInfo).WaitForExit();; }; }; ''@; [TopinambourDropper]::unpack_p("C:\Windows\System32\hostname.exe");
          [TopinambourDropper]::make_some_noise()'
        cleanup: schtasks /Delete /TN "VerifiedPublisherCertCheck" /F 2>&1 | Out-Null;
          if (Test-Path "$env:TEMP\T1053005_certcheck_backup.exe") {; Move-Item "$env:TEMP\T1053005_certcheck_backup.exe"
          "$env:LOCALAPPDATA\VirtualStore\certcheck.exe" -Force; } else {; Remove-Item
          "$env:LOCALAPPDATA\VirtualStore\certcheck.exe" -Force -ErrorAction SilentlyContinue;
          }
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1053.005
  - atomic-red-team
  - persistence
  author: Atomic Red Team
  additional_info:
    input_arguments:
      benign_exe:
        description: Benign executable to copy as the stand-in payload (simulates
          the dropped backdoor)
        type: path
        default: C:\Windows\System32\hostname.exe
    dependencies:
    - description: Back up any existing certcheck.exe in VirtualStore before overwriting
      prereq_command: '$dropPath = "$env:LOCALAPPDATA\VirtualStore\certcheck.exe"

        if ((Test-Path "$env:TEMP\T1053005_certcheck_backup.exe") -or !(Test-Path
        $dropPath)) { exit 0 } else { exit 1 }

        '
      get_prereq_command: 'Copy-Item "$env:LOCALAPPDATA\VirtualStore\certcheck.exe"
        "$env:TEMP\T1053005_certcheck_backup.exe" -Force

        '
