- id: eed8b13f-ad93-4b1e-8fa8-57cd400a0399
  name: Turla Mosquito Sandbox Evasion via SetupDiGetClassDevs Check
  description: 'Emulates the anti-sandbox / anti-emulation system check performed
    by the crypter used with Turla''s Mosquito

    backdoor, where after de-obfuscating its first layer, the backdoor calls the Win32
    API SetupDiGetClassDevs(0,0,0,0xFFFFFFFF). On real Windows 7/10

    hosts the call reliably returns 0xE000021A, whereas sandboxes and emulators that
    do not implement SetupAPI

    correctly return a different value, allowing the malware to detect and evade analysis
    environments.


    This test reproduces the same SetupDiGetClassDevs call via P/Invoke. It performs
    the API call the malware makes

    but deliberately does not branch or exit on the result; the observable behavior
    under test is the anomalous

    invocation of setupapi.dll!SetupDiGetClassDevs with the undocumented 0xFFFFFFFF
    (4294967295 in decimal) flag.


    Reference: https://www.welivesecurity.com/wp-content/uploads/2018/01/ESET_Turla_Mosquito.pdf'
  tactic: stealth
  technique:
    attack_id: T1497.001
    name: 'Virtualization/Sandbox Evasion: System Checks'
  platforms:
    windows:
      psh:
        command: Add-Type @"; using System;; using System.Runtime.InteropServices;;
          public static class MosquitoSandboxCheck {; [DllImport("setupapi.dll", SetLastError=true)];
          public static extern IntPtr SetupDiGetClassDevs(IntPtr ClassGuid, IntPtr
          Enumerator, IntPtr hwndParent, uint Flags);; }; "@; $null = [MosquitoSandboxCheck]::SetupDiGetClassDevs([IntPtr]::Zero,
          [IntPtr]::Zero, [IntPtr]::Zero, 4294967295)
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
