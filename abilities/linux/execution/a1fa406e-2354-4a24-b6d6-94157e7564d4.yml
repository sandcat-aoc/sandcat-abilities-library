- id: a1fa406e-2354-4a24-b6d6-94157e7564d4
  name: Create systemd Service Unit from /tmp (Unusual Location)
  description: 'Creates a systemd service unit file in /tmp and loads it using systemctl
    start with

    an absolute path. Adversaries may write service unit files to world-writable directories

    such as /tmp to avoid triggering alerts on new file creation in standard service

    directories, or to execute payloads transiently without permanently installing
    a service.


    Loading a service unit from an arbitrary path rather than a standard systemd directory

    is unusual behaviour that should be detectable by monitoring systemctl command
    arguments.'
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: 'if [ -x "$(command -v systemctl)" ]; then : ; else echo "systemctl
          is not available. Ensure systemd is running on this system."; fi; if [ -d
          "/tmp" ] && [ -w "/tmp" ]; then : ; else echo "/tmp does not exist or is
          not writable on this system."; fi; if [ "$(id -u)" -eq 0 ]; then : ; else
          echo "This test requires root privileges. Run as root or use sudo."; fi;
          echo "[Unit]" > /tmp/atomic_tmp.service; echo "Description=Atomic Tmp Service"
          >> /tmp/atomic_tmp.service; echo "" >> /tmp/atomic_tmp.service; echo "[Service]"
          >> /tmp/atomic_tmp.service; echo "ExecStart=/bin/bash -c "id > /tmp/atomic_tmp_output.txt""
          >> /tmp/atomic_tmp.service; echo "" >> /tmp/atomic_tmp.service; echo "[Install]"
          >> /tmp/atomic_tmp.service; echo "WantedBy=multi-user.target" >> /tmp/atomic_tmp.service;
          systemctl link /tmp/atomic_tmp.service; systemctl start $(basename /tmp/atomic_tmp.service);
          systemctl status $(basename /tmp/atomic_tmp.service)'
        cleanup: 'systemctl stop $(basename #{service_path}) 2>/dev/null || true;
          rm -f #{service_path}; rm -f /tmp/atomic_tmp_output.txt'
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1569.003
  - execution
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      service_path:
        description: Full path to the service file to be written in /tmp
        type: path
        default: /tmp/atomic_tmp.service
      command_to_run:
        description: Command the service will execute
        type: string
        default: /bin/bash -c "id > /tmp/atomic_tmp_output.txt"
    dependencies:
    - description: 'systemctl must be available on the system

        '
      prereq_command: 'if [ -x "$(command -v systemctl)" ]; then exit 0; else exit
        1; fi

        '
      get_prereq_command: 'echo "systemctl is not available. Ensure systemd is running
        on this system."

        '
    - description: '/tmp must exist and be writable

        '
      prereq_command: 'if [ -d "/tmp" ] && [ -w "/tmp" ]; then exit 0; else exit 1;
        fi

        '
      get_prereq_command: 'echo "/tmp does not exist or is not writable on this system."

        '
    - description: 'The test must be run as root or with sudo privileges

        '
      prereq_command: 'if [ "$(id -u)" -eq 0 ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo "This test requires root privileges. Run as root or
        use sudo."

        '
