- id: 876939d8-f325-fdd9-30ab-72ecb7562244
  name: funzip - extracts a ZIP or gzip file directly to output from archives or other piped input
  description: funzip is a macOS utility used to extract ZIP or gzip files directly to output. Malicious
    binaries misuse funzip, along with head or tail, to extract and reconstruct password-protected malicious
    payloads.
  tactic: execution
  technique:
    attack_id: T1059.002
    name: 'Command and Scripting Interpreter: AppleScript'
  platforms:
    darwin:
      sh:
        command: tail -c <> $0 | funzip  -<password>
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
