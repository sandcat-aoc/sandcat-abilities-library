- id: 303d67f0-3b7a-4a27-8fc9-995239ae8c51
  name: Enumerate Active Directory Users with csvde
  description: The following test uses csvde.exe to export a list of Active Directory
    users and their properties to a CSV file.
  tactic: discovery
  technique:
    attack_id: T1087.002
    name: 'Account Discovery: Domain Account'
  platforms:
    windows:
      sh:
        command: csvde -f users.csv -r "(&(objectClass=user)(objectCategory=person))"
          -l "DN,sAMAccountName,userPrincipalName,mail,displayName,description,memberOf"
        cleanup: del users.csv >nul 2>&1
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - t1087.002
  - discovery
  author: Atomic Red Team
