- id: 1214f818-673b-4494-9fbd-99af0e185866
  name: Linux File Type Masquerading via Extension Change
  description: Executes a shell script that has been disguised with a harmless image
    extension (.png).
  tactic: stealth
  technique:
    attack_id: T1036.008
    name: 'Masquerading: Masquerade File Type'
  platforms:
    linux:
      sh:
        command: echo '#!/bin/sh' > /tmp/image.png; echo 'echo "Running script masked
          as PNG"' >> /tmp/image.png; sh /tmp/image.png
        cleanup: rm -f /tmp/image.png
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
