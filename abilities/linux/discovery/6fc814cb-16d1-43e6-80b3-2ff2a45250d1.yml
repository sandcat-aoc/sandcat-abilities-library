- id: 6fc814cb-16d1-43e6-80b3-2ff2a45250d1
  name: Enumerate SSH Configuration
  description: 'SSH metadata files (authorized_keys, known_hosts, config) can be used
    to

    discover remote systems and trust relationships. known_hosts

    reveals previously connected servers, config exposes host aliases and jump

    proxies, and authorized_keys shows which public keys are trusted for login.'
  tactic: discovery
  technique:
    attack_id: T1018
    name: Remote System Discovery
  platforms:
    linux:
      sh:
        command: find / -name "known_hosts" -type f 2>/dev/null | while read -r file;
          do echo "=== $file ===" >> /tmp/ssh_enum.txt; cat "$file" >> /tmp/ssh_enum.txt;
          done
        cleanup: 'rm -f #{output_file}'
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - discovery
  - atomic-red-team
  - t1018
  author: Atomic Red Team
  additional_info:
    input_arguments:
      search_path:
        description: Directory to search under
        type: string
        default: /
      filename:
        description: SSH metadata file to search for
        type: string
        default: known_hosts
      output_file:
        description: File to write results to
        type: path
        default: /tmp/ssh_enum.txt
    technique_created: '2017-05-31T21:30:28.187Z'
    atomic_guid: 6fc814cb-16d1-43e6-80b3-2ff2a45250d1
    import_timestamp: '2026-09-06T06:52:20.596510Z'
