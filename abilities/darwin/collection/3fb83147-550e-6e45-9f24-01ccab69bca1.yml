- id: 3fb83147-550e-6e45-9f24-01ccab69bca1
  name: screencapture - Continuously capture screenshots
  description: The following command demonstrates how an attacker can use the tool to capture screenshots
    every 10 seconds. The -x flag prevents snapshot sounds from being played.
  tactic: collection
  technique:
    attack_id: T1113
    name: Screen Capture
  platforms:
    darwin:
      sh:
        command: while true; do ts=$(date +"%Y%m%d-%H%M%S"); o="/tmp/screenshots"; screencapture -x "$o/ss-$ts.png";
          sleep 10; done
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - screencapture
  - collection
  version: '1.0'
  author: LOOBins Project
  additional_info:
