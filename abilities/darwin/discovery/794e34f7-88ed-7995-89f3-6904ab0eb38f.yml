      sh:
        command: notifyutil -w com.apple.loginwindow.logout -w com.apple.springboard.attemptactivationend
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - notifyutil
  - discovery
  version: '1.0'
  author: LOOBins Project
