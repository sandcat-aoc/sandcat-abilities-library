- id: 10673ae5-713c-2a28-3a9a-ece795e490b0
  name: tftp - Run unprivileged TFTP server on a non-standard port
  description: Without root access, tftpd can be loaded from a user-created launchd plist stored anywhere
    on disk (e.g., /tmp). Passing the -w flag allows tftpd to create new files on write, removing the
    placeholder requirement. The server can be bound to any unprivileged port.
  tactic: lateral-movement
  technique:
    attack_id: T1021.004
    name: 'Remote Services: SSH'
  platforms:
    darwin:
      sh:
        command: "mkdir -p /tmp/tftp_server && chmod 777 /tmp/tftp_server\ntee /tmp/com.user.tftp.plist\
          \ > /dev/null << 'EOF'\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"\
          -//Apple Computer//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n\
          <plist version=\"1.0\">\n<dict>\n    <key>Label</key>\n    <string>com.user.tftp</string>\n\
          \    <key>WorkingDirectory</key>\n    <string>/tmp/tftp_server</string>\n    <key>ProgramArguments</key>\n\
          \    <array>\n        <string>/usr/libexec/tftpd</string>\n        <string>-w</string>\n   \
          \     <string>-l</string>\n        <string>-u</string>\n        <string>$(whoami)</string>\n\
          \    </array>\n    <key>inetdCompatibility</key>\n    <dict>\n        <key>Wait</key>\n    \
          \    <true/>\n    </dict>\n    <key>Sockets</key>\n    <dict>\n        <key>Listeners</key>\n\
          \        <dict>\n            <key>SockServiceName</key>\n            <string>6969</string>\n\
          \            <key>SockType</key>\n            <string>dgram</string>\n            <key>SockFamily</key>\n\
          \            <string>IPv4</string>\n        </dict>\n    </dict>\n</dict>\n</plist>\nEOF\nlaunchctl\
          \ load -w /tmp/com.user.tftp.plist"
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - tftp
  - lateral-movement
  version: '1.0'
  author: LOOBins Project
  additional_info:
    loobins_tool: tftp
    use_case: Run unprivileged TFTP server on a non-standard port
    source_file: tftp.yml
