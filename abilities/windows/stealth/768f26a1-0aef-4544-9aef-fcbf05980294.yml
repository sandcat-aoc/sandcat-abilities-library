  name: T1218.013 - Proxy Execution via Mavinject /STARTAPP Virtual Package Trigger
  description: Simulates an adversary leveraging mavinject.exe /STARTAPP to launch
    an arbitrary executable under an App-V subsystem context.
  tactic: stealth
  technique:
    attack_id: T1218.013
    name: 'System Binary Proxy Execution: Mavinject'
  platforms:
