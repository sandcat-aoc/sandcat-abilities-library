- id: 58514842-d3d0-15a9-998a-f72ddeba21e5
  name: pmset - List active power assertions to identify running applications
  description: pmset -g assertions lists the processes currently preventing idle or display sleep, without
    requiring root. This exposes which applications are actively running and holding the machine awake,
    complementing the sleep/wake timeline as a signal of user presence and workload.
  tactic: discovery
  technique:
    attack_id: T1087.001
    name: 'Account Discovery: Local Account'
  platforms:
    darwin:
      sh:
        command: pmset -g assertions
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - pmset
  - discovery
