- id: c8367142-cbb0-47a4-96c7-ff9969fd64ea
  name: Search for Git Credential Files
  description: 'Searches the specified directory for a git credential file, which

    may contain plaintext credentials, access tokens, or credential helper

    configurations. Example files include .git-credentials and .gitconfig.'
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    linux:
      sh:
        command: find / -name '.git-credentials' -type f -exec sh -c 'echo "=== $1
          ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt' _ {} \; 2>/dev/null
        cleanup: rm -f /tmp/creds.txt
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1552.001
  - atomic-red-team
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      file_path:
        description: directory to search under
        type: string
        default: /
      filename:
        description: git credential file to search for
        type: string
        default: .git-credentials
      optional_flags:
        description: optional flags passed into find that should be ran
        type: string
        default: -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \;
    technique_created: '2020-02-04T12:52:13.006Z'
    atomic_guid: c8367142-cbb0-47a4-96c7-ff9969fd64ea
    import_timestamp: '2026-09-06T06:52:20.421123Z'
