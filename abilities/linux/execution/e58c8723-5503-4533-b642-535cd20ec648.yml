- id: e58c8723-5503-4533-b642-535cd20ec648
  name: Create and Enable a Malicious systemd Service Unit
  description: 'Creates a new systemd service unit file in /etc/systemd/system/ and
    enables it using

    systemctl enable followed by systemctl start. Adversaries commonly abuse this
    workflow

    to establish persistence or execute arbitrary commands under the context of systemd.


    This simulates the full attacker workflow: writing the unit file, reloading the
    systemd

    daemon, enabling the service to survive reboots, and starting it immediately.
    This is

    consistent with techniques observed in ransomware precursor activity and post-exploitation

    frameworks targeting Linux infrastructure.'
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: 'if [ -x "$(command -v systemctl)" ]; then : ; else echo "systemctl
          is not available. Ensure systemd is running on this system."; fi; if [ "$(id
          -u)" -eq 0 ]; then : ; else echo "This test requires root privileges. Run
          as root or use sudo."; fi; if [ -d "/etc/systemd/system" ] && [ -w "/etc/systemd/system"
          ]; then : ; else echo "/etc/systemd/system/ does not exist or is not writable.
          Ensure systemd is installed."; fi; echo "[Unit]" > /etc/systemd/system/atomic-test.service;
          echo "Description=Atomic Test Service" >> /etc/systemd/system/atomic-test.service;
          echo "After=network.target" >> /etc/systemd/system/atomic-test.service;
          echo "" >> /etc/systemd/system/atomic-test.service; echo "[Service]" >>
          /etc/systemd/system/atomic-test.service; echo "ExecStart=/bin/bash -c "echo
          atomictest > /tmp/atomic_service_output.txt"" >> /etc/systemd/system/atomic-test.service;
          echo "Restart=on-failure" >> /etc/systemd/system/atomic-test.service; echo
          "" >> /etc/systemd/system/atomic-test.service; echo "[Install]" >> /etc/systemd/system/atomic-test.service;
          echo "WantedBy=multi-user.target" >> /etc/systemd/system/atomic-test.service;
          systemctl daemon-reload; systemctl enable atomic-test.service; systemctl
          start atomic-test.service; systemctl status atomic-test.service'
        cleanup: 'systemctl stop #{service_name}.service 2>/dev/null || true; systemctl
          disable #{service_name}.service 2>/dev/null || true; rm -f /etc/systemd/system/#{service_name}.service;
          systemctl daemon-reload; rm -f /tmp/atomic_service_output.txt'
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1569.003
  - atomic-red-team
  - execution
  author: Atomic Red Team
  additional_info:
    input_arguments:
      service_name:
        description: Name of the malicious service to create
        type: string
        default: atomic-test
      command_to_run:
        description: Command the service will execute
        type: string
        default: /bin/bash -c "echo atomictest > /tmp/atomic_service_output.txt"
    dependencies:
    - description: 'systemctl must be available on the system

        '
      prereq_command: 'if [ -x "$(command -v systemctl)" ]; then exit 0; else exit
        1; fi

        '
      get_prereq_command: 'echo "systemctl is not available. Ensure systemd is running
        on this system."

        '
    - description: 'The test must be run as root or with sudo privileges

        '
      prereq_command: 'if [ "$(id -u)" -eq 0 ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo "This test requires root privileges. Run as root or
        use sudo."

        '
    - description: '/etc/systemd/system/ directory must exist and be writable

        '
      prereq_command: 'if [ -d "/etc/systemd/system" ] && [ -w "/etc/systemd/system"
        ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo "/etc/systemd/system/ does not exist or is not writable.
        Ensure systemd is installed."

        '
