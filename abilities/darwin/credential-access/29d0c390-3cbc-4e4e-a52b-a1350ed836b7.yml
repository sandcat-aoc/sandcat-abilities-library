- id: 29d0c390-3cbc-4e4e-a52b-a1350ed836b7
  name: Query Chrome Login Data In Place with sqlite3 - MacOS
  description: 'Reads Google Chrome''s `Login Data` SQLite database in place with
    the Apple-signed `/usr/bin/sqlite3`

    binary, instead of copying the database somewhere else first. The saved origin
    URLs and usernames are

    written to the output file. Passwords stay in the `password_value` BLOB column
    and remain encrypted with

    the Chrome Safe Storage key, so this test collects the credential index rather
    than plaintext secrets.


    The `?immutable=1` URI parameter is the part that matters. Chrome holds a lock
    on the database while it

    is running, and a plain `sqlite3 "<path>" "SELECT ..."` fails with `Error: in
    prepare, database is locked (5)`.

    Opening the file through a `file:` URI with `immutable=1` reads it without taking
    a lock, so the test works

    against a live browser and does not need to kill Chrome first, which is what the
    published LOOBins one-liner

    for Firefox does.


    This matters for detection because `sqlite3` ships with macOS and is signed by
    Apple, so controls that key

    on code signing trust or on an unknown binary touching the profile directory do
    not fire on it.


    [LOOBins sqlite3](https://www.loobins.io/binaries/sqlite3/) documents the same
    binary being used against

    browser cookie databases. [Red Canary](https://redcanary.com/blog/threat-intelligence/clipping-silver-sparrows-wings/)

    documented macOS malware invoking the `sqlite3` CLI, and

    [Jamf](https://www.jamf.com/blog/crashstealer-macos-infostealer-analysis/) documented
    a macOS infostealer

    working around the same database lock through the SQLite backup API.


    Upon successful execution, the output file contains one line per saved login in
    the form

    `origin_url|username_value`. If Chrome has no saved logins the file is created
    and left empty.'
  tactic: credential-access
  technique:
    attack_id: T1555.003
    name: 'Credentials from Password Stores: Credentials from Web Browsers'
  platforms:
    darwin:
      sh:
        command: 'if [ -f "$HOME/Library/Application Support/Google/Chrome/Default/Login
          Data" ]; then : ; else brew install --cask google-chrome; xattr -d com.apple.quarantine
          "/Applications/Google Chrome.app"; open -a "Google Chrome" && sleep 5 &&
          killall -KILL "Google Chrome"; fi; sqlite3 "file:$HOME/Library/Application
          Support/Google/Chrome/Default/Login Data?immutable=1" "SELECT origin_url,
          username_value FROM logins;" > "/tmp/T1555.003_chrome_logins.txt"; cat "/tmp/T1555.003_chrome_logins.txt"'
        cleanup: rm -f "#{output_file}"
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - t1555.003
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      chrome_profile:
        description: Name of the Chrome profile directory to read
        type: string
        default: Default
      output_file:
        description: Path the query results are written to
        type: path
        default: /tmp/T1555.003_chrome_logins.txt
    dependencies:
    - description: 'Chrome''s Login Data database must exist for profile #{chrome_profile}

        '
      prereq_command: 'if [ -f "$HOME/Library/Application Support/Google/Chrome/#{chrome_profile}/Login
        Data" ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'brew install --cask google-chrome

        xattr -d com.apple.quarantine "/Applications/Google Chrome.app"

        open -a "Google Chrome" && sleep 5 && killall -KILL "Google Chrome"

        '
    technique_created: '2020-02-12T18:57:36.041Z'
