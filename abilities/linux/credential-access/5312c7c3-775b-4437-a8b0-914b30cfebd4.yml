- id: 5312c7c3-775b-4437-a8b0-914b30cfebd4
  name: Access Travis CI Config File
  description: Find Travis CI configuration files (.travis.yml), which may contain
    credentials, secrets, or sensitive environment variables.
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    linux:
      sh:
        command: find / -name '.travis.yml' -type f -exec sh -c 'echo "=== $1 ==="
          >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt' _ {} \; 2>/dev/null
        cleanup: rm -f /tmp/creds.txt
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1552.001
  - atomic-red-team
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      file_path:
        description: Path to search
        type: string
        default: /
      filename:
        description: Name of file to search for
        type: string
        default: .travis.yml
      optional_flags:
        description: optional flags passed into find that should be ran
        type: string
        default: -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \;
    technique_created: '2020-02-04T12:52:13.006Z'
