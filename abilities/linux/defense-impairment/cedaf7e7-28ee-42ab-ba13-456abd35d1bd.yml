      sh:
        command: echo '#art_test_1562_006_1' >> /etc/security/audit_event
        cleanup: sed -i "" '/#art_test_1562_006_1/d' /etc/security/#{auditd_config_file_name}
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
