- id: 5750aa16-0e59-4410-8b9a-8a47ca2788e2
  name: WMI Reconnaissance Processes
  description: 'An adversary might use WMI to list Processes running on the compromised
    host.

    When the test completes , there should be running processes listed on the command
    line.'
  tactic: execution
  technique:
    attack_id: T1047
    name: Windows Management Instrumentation
  platforms:
    windows:
      sh:
        command: 'if (Test-Path "$env:SystemRoot\System32\wbem\wmic.exe") {exit 0}
          else {exit 1}; then : ; else DISM /Online /Add-Capability /CapabilityName:WMIC~~~~;
          fi; wmic process get caption,executablepath,commandline /format:csv'
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1047
  - execution
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    dependencies:
    - description: 'wmic.exe must be present on the system. It is disabled by default
        on Windows 11, version 24H2 and later, and removed when upgrading to version
        25H2.

        '
      prereq_command: 'if (Test-Path "$env:SystemRoot\System32\wbem\wmic.exe") {exit
        0} else {exit 1}

        '
      get_prereq_command: 'DISM /Online /Add-Capability /CapabilityName:WMIC~~~~

        '
