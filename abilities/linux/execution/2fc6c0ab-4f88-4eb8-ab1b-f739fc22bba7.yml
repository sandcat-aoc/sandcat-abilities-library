- id: 2fc6c0ab-4f88-4eb8-ab1b-f739fc22bba7
  name: Enable systemd Service for Persistence with Auto-Restart
  description: 'Creates a payload script and a systemd service unit that executes
    it, then enables

    the service to survive reboots using systemctl enable. The service is configured
    with

    Restart=always to automatically restart on failure, mimicking the persistence
    mechanism

    used by adversaries deploying backdoors or beacons on Linux hosts.


    This technique is consistent with observed post-exploitation tradecraft where
    adversaries

    establish a foothold that survives reboots and self-heals after interruption,
    complicating

    incident response and remediation efforts.'
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: 'if [ -x "$(command -v systemctl)" ]; then : ; else echo "systemctl
          is not available. Ensure systemd is running on this system."; fi; if [ "$(id
          -u)" -eq 0 ]; then : ; else echo "This test requires root privileges. Run
          as root or use sudo."; fi; if [ -d "/etc/systemd/system" ] && [ -w "/etc/systemd/system"
          ]; then : ; else echo "/etc/systemd/system/ does not exist or is not writable.";
          fi; if [ -f "/tmp/atomic_payload.sh" ]; then : ; else echo ''#!/bin/bash''
          > /tmp/atomic_payload.sh; echo ''echo persistent >> /tmp/atomic_persist_output.txt''
          >> /tmp/atomic_payload.sh; chmod +x /tmp/atomic_payload.sh; fi; echo "[Unit]"
          > /etc/systemd/system/atomic-persist.service; echo "Description=Atomic Persistence
          Service" >> /etc/systemd/system/atomic-persist.service; echo "After=network.target"
          >> /etc/systemd/system/atomic-persist.service; echo "" >> /etc/systemd/system/atomic-persist.service;
          echo "[Service]" >> /etc/systemd/system/atomic-persist.service; echo "ExecStart=/tmp/atomic_payload.sh"
          >> /etc/systemd/system/atomic-persist.service; echo "Restart=always" >>
          /etc/systemd/system/atomic-persist.service; echo "RestartSec=10" >> /etc/systemd/system/atomic-persist.service;
          echo "" >> /etc/systemd/system/atomic-persist.service; echo "[Install]"
          >> /etc/systemd/system/atomic-persist.service; echo "WantedBy=multi-user.target"
          >> /etc/systemd/system/atomic-persist.service; systemctl daemon-reload;
          systemctl enable atomic-persist.service; systemctl start atomic-persist.service;
          systemctl status atomic-persist.service'
        cleanup: 'systemctl stop #{service_name}.service 2>/dev/null || true; systemctl
          disable #{service_name}.service 2>/dev/null || true; rm -f /etc/systemd/system/#{service_name}.service;
          rm -f /etc/systemd/system/multi-user.target.wants/#{service_name}.service;
          systemctl daemon-reload; rm -f #{payload_path}; rm -f /tmp/atomic_persist_output.txt'
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1569.003
  - atomic-red-team
  - execution
  author: Atomic Red Team
  additional_info:
    input_arguments:
      service_name:
        description: Name of the persistence service to create
        type: string
        default: atomic-persist
      payload_path:
        description: Path to the payload script that the service will execute
        type: path
        default: /tmp/atomic_payload.sh
    dependencies:
    - description: 'systemctl must be available on the system

        '
      prereq_command: 'if [ -x "$(command -v systemctl)" ]; then exit 0; else exit
        1; fi

        '
      get_prereq_command: 'echo "systemctl is not available. Ensure systemd is running
        on this system."

        '
    - description: 'The test must be run as root or with sudo privileges

        '
      prereq_command: 'if [ "$(id -u)" -eq 0 ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo "This test requires root privileges. Run as root or
        use sudo."

        '
    - description: '/etc/systemd/system/ directory must exist and be writable

        '
      prereq_command: 'if [ -d "/etc/systemd/system" ] && [ -w "/etc/systemd/system"
        ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo "/etc/systemd/system/ does not exist or is not writable."

        '
    - description: 'Payload script must exist at the specified path

        '
      prereq_command: 'if [ -f "#{payload_path}" ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo ''#!/bin/bash'' > #{payload_path}

        echo ''echo persistent >> /tmp/atomic_persist_output.txt'' >> #{payload_path}

        chmod +x #{payload_path}

        '
