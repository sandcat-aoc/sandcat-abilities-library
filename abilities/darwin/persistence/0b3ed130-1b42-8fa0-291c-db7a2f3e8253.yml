- id: 0b3ed130-1b42-8fa0-291c-db7a2f3e8253
  name: kmutil - Install a custom boot object to gain pre-boot code execution on Apple silicon
  description: The Recovery-only configure-boot subcommand installs a Mach-O that iBoot loads and starts,
    placing attacker-controlled code ahead of the OS in the boot chain by setting the CustomOS Image4
    manifest hash in a Mac's LocalPolicy. The prerequisites are interactive. The machine must be in Recovery,
    an administrator must already have selected Reduced Security in Startup Security Utility, and kmutil
    prompts for confirmation before downgrading further to Permissive Security. It needs physical access
    or a management path that can force a Recovery boot, not remote code execution alone.
  tactic: persistence
  technique:
    attack_id: T1547.001
    name: 'Boot or Logon Autostart Execution: Registry Run Keys / Startup Folder'
  platforms:
    darwin:
      sh:
        command: kmutil configure-boot --custom-boot-object <PAYLOAD_MACHO> --volume /Volumes/<TARGET_VOLUME>
  singleton: true
  privilege: User
  repeatable: false
  delete_payload: false
  buckets:
  - loobins
  - kmutil
  - persistence
