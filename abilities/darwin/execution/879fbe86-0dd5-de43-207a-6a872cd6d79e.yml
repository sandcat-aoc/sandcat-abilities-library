- id: 879fbe86-0dd5-de43-207a-6a872cd6d79e
  name: Script Editor - Open a pre-filled script from a web page via the applescript URL scheme
  description: A malicious web page opens an applescript URL, which launches Script Editor with attacker-supplied
    script text in a new document. The user is told to click Run. Jamf Threat Labs (Atomic Stealer) and
    SentinelOne (SHub Reaper) observed this. Neither report publishes the campaign URL. The code shown
    comes from the application's URL handler and is not a published indicator.
  tactic: execution
  technique:
    attack_id: T1059.002
    name: 'Command and Scripting Interpreter: AppleScript'
  platforms:
    darwin:
      sh:
        command: applescript://com.apple.scripteditor?action=new&script=<URL-ENCODED_APPLESCRIPT>
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - script editor
  - execution
  version: '1.0'
  author: LOOBins Project
