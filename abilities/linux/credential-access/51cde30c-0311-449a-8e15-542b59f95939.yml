- id: 51cde30c-0311-449a-8e15-542b59f95939
  name: Dump GitHub Actions Runner Environment Variables from procfs
  description: 'Locates GitHub Actions runner processes (Runner.Worker, Runner.Listener,
    runsvc, run.sh)

    and reads their environment variables from /proc/<pid>/environ, filtering for
    keys

    containing "env" or "ssh". This mirrors TeamPCP malware behavior that harvests

    credentials and secrets from self-hosted runner processes.


    Reference: https://www.aquasec.com/blog/trivy-supply-chain-attack-what-you-need-to-know/'
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    linux:
      sh:
        command: for pid in $(pgrep -f 'Runner.Worker|Runner.Listener|runsvc|run.sh'
          2>/dev/null); do tr '\0' '\n' < /proc/$pid/environ 2>/dev/null | grep -iE
          'env|ssh'; done
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - t1552.001
  - credential-access
  author: Atomic Red Team
