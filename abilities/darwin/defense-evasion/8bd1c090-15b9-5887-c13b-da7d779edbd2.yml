- id: 8bd1c090-15b9-5887-c13b-da7d779edbd2
  name: kmutil - Terminate IOService instances to disable a driver without fully unloading its kext
  description: unload --class-name terminates all instances of a named IOService class while leaving the
    kext loaded. Adding --personalities-only also removes the kext's personalities so the driver cannot
    restart. Either form stops the driver from doing work while leaving the kext visible in showloaded
    output. Requires root.
  tactic: defense-evasion
  technique:
    attack_id: T1562.001
    name: 'Impair Defenses: Disable or Modify Tools'
  platforms:
    darwin:
      sh:
        command: sudo kmutil unload --class-name <TARGET_IOSERVICE_CLASS>
  singleton: true
  privilege: Elevated
  repeatable: false
  delete_payload: false
  buckets:
  - loobins
  - kmutil
  - defense-evasion
