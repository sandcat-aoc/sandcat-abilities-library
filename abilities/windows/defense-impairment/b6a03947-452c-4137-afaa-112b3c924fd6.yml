- id: b6a03947-452c-4137-afaa-112b3c924fd6
  name: Turla Mosquito - Store Backdoor Path in OneDriveUpdate Registry Key
  description: "Emulates the registry-storing behavior of Turla's Mosquito backdoor.\
    \ Mosquito records its components in the registry key HKCU\\Software\\Microsoft\\\
    Windows\\OneDriveUpdate\nso its loader can reassemble the chain at runtime. It\
    \ writes:\n\n  1. The name of the original (legitimately hijacked) DLL, tagged\
    \ with the CLSID, into an\n     \"explorer.exe\" value under the OneDriveUpdate\
    \ key.\n  2. The path to the main backdoor into the default value of the same\
    \ OneDriveUpdate key.\n\nMosquito disguises its backdoor as an Adobe Acrobat support\
    \ file (AdobeSysFnt09.pdb). This test\nonly writes the registry values referencing\
    \ that IOC-matching file path and hijacked DLL name.\n\nReference: https://www.welivesecurity.com/wp-content/uploads/2018/05/ESET_Turla_Mosquito.pdf"
  tactic: defense-impairment
  technique:
    attack_id: T1112
    name: Modify Registry
  platforms:
    windows:
      psh:
        command: '$backupFile = "$env:TEMP\T1112_mosquito_onedriveupdate_backup.reg";
          if ((Test-Path $backupFile) -or (-not (Test-Path "HKCU:\Software\Microsoft\Windows\OneDriveUpdate")))
          { exit 0 } else { exit 1 }; then : ; else $backupFile = "$env:TEMP\T1112_mosquito_onedriveupdate_backup.reg";
          reg export "HKCU\Software\Microsoft\Windows\OneDriveUpdate" "$backupFile"
          /y | Out-Null; fi; $updateKey = "HKCU:\Software\Microsoft\Windows\OneDriveUpdate";
          New-Item -Path $updateKey -Force | Out-Null; Set-ItemProperty -Path $updateKey
          -Name ''explorer.exe'' -Value ''%SystemRoot%\system32\EhStorShell.dll;{d9144dcd-e998-4eca-ab6a-dcd83ccba16d};new'';
          Set-Item -Path $updateKey -Value ''%APPDATA%\Adobe\Acrobat\9.0\AdobeSysFnt09.pdb'''
        cleanup: $backupFile = "$env:TEMP\T1112_mosquito_onedriveupdate_backup.reg";
          $regPath = "HKCU:\Software\Microsoft\Windows\OneDriveUpdate".Replace('HKCU:',
          'HKCU'); reg delete "$regPath" /f 2>&1 | Out-Null; if (Test-Path $backupFile)
          {; reg import "$backupFile" 2>&1 | Out-Null; Remove-Item $backupFile -Force
          -ErrorAction Ignore; }
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1112
  - atomic-red-team
  - defense-impairment
  author: Atomic Red Team
  additional_info:
    dependencies:
    - description: 'Back up any pre-existing OneDriveUpdate registry key so its original
        values can be restored during cleanup.

        '
      prereq_command: '$backupFile = "$env:TEMP\T1112_mosquito_onedriveupdate_backup.reg"

        if ((Test-Path $backupFile) -or (-not (Test-Path "HKCU:\Software\Microsoft\Windows\OneDriveUpdate")))
        { exit 0 } else { exit 1 }

        '
      get_prereq_command: '$backupFile = "$env:TEMP\T1112_mosquito_onedriveupdate_backup.reg"

        reg export "HKCU\Software\Microsoft\Windows\OneDriveUpdate" "$backupFile"
        /y | Out-Null

        '
