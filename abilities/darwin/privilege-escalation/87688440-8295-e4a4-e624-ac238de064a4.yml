- id: 87688440-8295-e4a4-e624-ac238de064a4
  name: dseditgroup - Edit a group using explicit credentials on a local or network directory node
  description: The -n parameter selects the Directory Services node (the local node "." or a bound LDAP/Active
    Directory server) and -u/-P supply admin credentials to authenticate against it. With harvested credentials
    an attacker can add accounts to groups on the local node without a root shell, or on a bound directory
    server to propagate changes to every Mac bound to that node. The -P password appears in the process
    argument list.
  tactic: privilege-escalation
  technique:
    attack_id: T1068
    name: Exploitation for Privilege Escalation
  platforms:
    darwin:
      sh:
        command: dseditgroup -o edit -n /LDAPv3/<DIRECTORY_SERVER> -u <DIR_ADMIN> -P <PASSWORD> -a <TARGET_USER>
          -t user <GROUP>
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - dseditgroup
  - privilege-escalation
  version: '1.0'
  author: LOOBins Project
