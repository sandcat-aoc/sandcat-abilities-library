- id: 6123928f-6389-4914-8d25-a5d69bd657fa
  name: Modify Existing systemd Service to Execute Malicious Command
  description: 'Creates a service unit file that initially runs a benign command,
    then modifies the

    ExecStart directive using sed to substitute a malicious command before reloading
    and

    restarting the service. Adversaries may hijack existing services to blend in with
    normal

    service activity and avoid triggering detections focused solely on new service
    creation.


    This technique reflects the tradecraft observed in more sophisticated intrusions
    where

    blending into existing process trees is a priority over creating net-new services.'
  tactic: execution
  technique:
    attack_id: T1569.003
    name: 'System Services: Systemctl'
  platforms:
    linux:
      sh:
        command: 'if [ -x "$(command -v systemctl)" ]; then : ; else echo "systemctl
          is not available. Ensure systemd is running on this system."; fi; if [ -x
          "$(command -v sed)" ]; then : ; else apt-get install -y sed 2>/dev/null
          || yum install -y sed 2>/dev/null || echo "Could not install sed automatically.";
          fi; if [ "$(id -u)" -eq 0 ]; then : ; else echo "This test requires root
          privileges. Run as root or use sudo."; fi; if [ -d "/etc/systemd/system"
          ] && [ -w "/etc/systemd/system" ]; then : ; else echo "/etc/systemd/system/
          does not exist or is not writable."; fi; echo "[Unit]" > /etc/systemd/system/atomic-modify-test.service;
          echo "Description=Legitimate Looking Service" >> /etc/systemd/system/atomic-modify-test.service;
          echo "" >> /etc/systemd/system/atomic-modify-test.service; echo "[Service]"
          >> /etc/systemd/system/atomic-modify-test.service; echo "ExecStart=/bin/true"
          >> /etc/systemd/system/atomic-modify-test.service; echo "" >> /etc/systemd/system/atomic-modify-test.service;
          echo "[Install]" >> /etc/systemd/system/atomic-modify-test.service; echo
          "WantedBy=multi-user.target" >> /etc/systemd/system/atomic-modify-test.service;
          systemctl daemon-reload; sed -i ''s|ExecStart=.*|ExecStart=/bin/bash -c
          "echo hijacked > /tmp/atomic_hijack_output.txt"|'' /etc/systemd/system/atomic-modify-test.service;
          systemctl daemon-reload; systemctl start atomic-modify-test.service; systemctl
          status atomic-modify-test.service'
        cleanup: 'systemctl stop #{service_name}.service 2>/dev/null || true; systemctl
          disable #{service_name}.service 2>/dev/null || true; rm -f /etc/systemd/system/#{service_name}.service;
          systemctl daemon-reload; rm -f /tmp/atomic_hijack_output.txt'
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - t1569.003
  - execution
  author: Atomic Red Team
  additional_info:
    input_arguments:
      service_name:
        description: Name of the service to create and then modify for the test
        type: string
        default: atomic-modify-test
      malicious_command:
        description: Malicious command to substitute into ExecStart
        type: string
        default: /bin/bash -c "echo hijacked > /tmp/atomic_hijack_output.txt"
    dependencies:
    - description: 'systemctl must be available on the system

        '
      prereq_command: 'if [ -x "$(command -v systemctl)" ]; then exit 0; else exit
        1; fi

        '
      get_prereq_command: 'echo "systemctl is not available. Ensure systemd is running
        on this system."

        '
    - description: 'sed must be available on the system

        '
      prereq_command: 'if [ -x "$(command -v sed)" ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'apt-get install -y sed 2>/dev/null || yum install -y sed
        2>/dev/null || echo "Could not install sed automatically."

        '
    - description: 'The test must be run as root or with sudo privileges

        '
      prereq_command: 'if [ "$(id -u)" -eq 0 ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo "This test requires root privileges. Run as root or
        use sudo."

        '
    - description: '/etc/systemd/system/ directory must exist and be writable

        '
      prereq_command: 'if [ -d "/etc/systemd/system" ] && [ -w "/etc/systemd/system"
        ]; then exit 0; else exit 1; fi

        '
      get_prereq_command: 'echo "/etc/systemd/system/ does not exist or is not writable."

        '
