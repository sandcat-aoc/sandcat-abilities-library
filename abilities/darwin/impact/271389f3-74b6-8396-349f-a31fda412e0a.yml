- id: 271389f3-74b6-8396-349f-a31fda412e0a
  name: diskutil - Destroy an APFS container and all its volumes
  description: apfs deleteContainer destroys an entire APFS container and every volume in it, while apfs
    deleteVolume and apfs deleteVolumeGroup remove individual APFS volumes and their Preboot and Recovery
    entries. Ownership of the affected disk is required, and the deletion is irreversible.
  tactic: impact
  technique:
    attack_id: T1490
    name: Inhibit System Recovery
  platforms:
    darwin:
      sh:
        command: diskutil apfs deleteContainer <CONTAINER_DEVICE>
  singleton: true
  privilege: User
  repeatable: false
  delete_payload: false
  buckets:
  - loobins
  - diskutil
  - impact
  version: '1.0'
  author: LOOBins Project
