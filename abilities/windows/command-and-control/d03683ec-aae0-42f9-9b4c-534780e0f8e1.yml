- id: d03683ec-aae0-42f9-9b4c-534780e0f8e1
  name: LogMeIn Files Detected Test on Windows
  description: An adversary may attempt to trick the user into downloading LogMeIn
    and use to establish C2. Download of LogMeIn installer will be at the destination
    location and ran when sucessfully executed.
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: Remote Access Software
  platforms:
    windows:
      psh:
        command: 'if(Test-Path "PathToAtomicsFolder\..\ExternalPayloads\LogMeInIgnition.msi")
          {; exit 0; } else {; exit 1; }; then : ; else $parentpath = Split-Path "PathToAtomicsFolder\..\ExternalPayloads\LogMeInIgnition.msi";
          New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null;
          Invoke-WebRequest -Uri https://secure.logmein.com/LogMeInIgnition.msi -OutFile
          "PathToAtomicsFolder\..\ExternalPayloads\LogMeInIgnition.msi"; fi; Start-Process
          -Wait "PathToAtomicsFolder\..\ExternalPayloads\LogMeInIgnition.msi" /quiet;;
          Start-Process ''C:\Program Files (x86)\LogMeIn Ignition\LMIIgnition.exe''
          "/S"'
        cleanup: get-package *'LogMeIn Client'* -ErrorAction Ignore | uninstall-package;
          Remove-Item "#{installer_path}" -ErrorAction Ignore; Stop-Process -Name
          "msedge" -Force -ErrorAction Ignore; Get-ChildItem "C:\Users\*\AppData\Local"
          "LogMeIn" -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object
          {; $Directory = $_.ToString(); Remove-Item $Directory -Recurse -Force -ErrorAction
          SilentlyContinue; }; Remove-Item "C:\ProgramData\LogMeIn" -Recurse -Force
          -ErrorAction SilentlyContinue
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - command-and-control
  - t1219
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      installer_path:
        description: where the installer will be downloaded to or already is located
        type: path
        default: PathToAtomicsFolder\..\ExternalPayloads\LogMeInIgnition.msi
      download_url:
        description: url to download LogMeIn from
        type: url
        default: https://secure.logmein.com/LogMeInIgnition.msi
    dependencies:
    - description: 'LogMeIn installer must exist on disk at the specified location
        (#{installer_path})

        '
      prereq_command: "if(Test-Path \"#{installer_path}\") {\n    exit 0\n} else {\n\
        \    exit 1\n}\n"
      get_prereq_command: '$parentpath = Split-Path "#{installer_path}"

        New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null

        Invoke-WebRequest -Uri #{download_url} -OutFile "#{installer_path}"

        '
    technique_created: '2018-04-18T17:59:24.739Z'
