- id: 6e8dea32-206e-482c-bdfa-f1ca6a737258
  name: Turla Snake Queue File Artifact
  description: 'Creates a fake Snake malware queue file in %windir%\Registration with
    the naming convention

    <RANDOM_GUID>.<RANDOM_GUID>.crmlog, filled with random bytes to simulate encrypted
    data that will be decrypted by Snake''s kernel driver.

    In real samples, the decrypted queue file contans key material, communication
    channels, modes of operation, logs, and command specifications.


    Reference: https://media.defense.gov/2023/May/09/2003218554/-1/-1/0/JOINT_CSA_HUNTING_RU_INTEL_SNAKE_MALWARE_20230509.PDF'
  tactic: stealth
  technique:
    attack_id: T1027.013
    name: 'Obfuscated Files or Information: Encrypted/Encoded File'
  platforms:
    windows:
      psh:
        command: $guid1 = [guid]::NewGuid().ToString(); $guid2 = [guid]::NewGuid().ToString();
          $filePath = "$env:windir\Registration\$guid1.$guid2.crmlog"; $bytes = New-Object
          byte[] 4096; (New-Object Random).NextBytes($bytes); [IO.File]::WriteAllBytes($filePath,
          $bytes); $filePath | Out-File "$env:TEMP\T1027.013_snake_queue.txt"
        cleanup: $pathFile = "$env:TEMP\T1027.013_snake_queue.txt"; if (Test-Path
          $pathFile) {; Remove-Item (Get-Content $pathFile) -Force -ErrorAction SilentlyContinue;
          Remove-Item $pathFile -Force; }
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1027.013
  - stealth
  - atomic-red-team
  author: Atomic Red Team
