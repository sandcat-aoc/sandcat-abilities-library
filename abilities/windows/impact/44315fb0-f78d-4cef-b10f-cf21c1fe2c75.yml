- id: 44315fb0-f78d-4cef-b10f-cf21c1fe2c75
  name: Windows - Simulate CPU Load with PowerShell
  description: 'This test simulates high CPU load using PowerShell, commonly seen
    in resource hijacking.

    Spawns background jobs to stress CPU cores for a specified duration.'
  tactic: impact
  technique:
    attack_id: T1496
    name: Resource Hijacking
  platforms:
    windows:
      psh:
        command: $end = (Get-Date).AddSeconds(30); 1..4 | ForEach-Object { Start-Job
          { param($t) while((Get-Date) -lt $t) { $i=0; while($i -lt 200000){$i++}
          } } -ArgumentList $end }; Get-Job | Wait-Job | Remove-Job
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - impact
  - t1496
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      duration_seconds:
        description: Duration in seconds to run the CPU stress test
        type: integer
        default: 30
      cpu_threads:
        description: Number of threads to stress (default 4)
        type: integer
        default: 4
