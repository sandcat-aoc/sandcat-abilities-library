- id: 6efc666c-ebff-0ad7-e0bc-7cf932597936
  name: osascript - Execute shell commands via osascript do shell script
  description: osascript's 'do shell script' handler executes arbitrary shell commands through the AppleScript
    runtime. Commands spawned this way are children of osascript rather than the calling shell, which
    can bypass detection logic tied to specific parent-child process relationships. The 'with administrator
    privileges' flag triggers a native macOS authentication prompt and runs the command as root if the
    user authenticates, without requiring sudo.
  tactic: execution
  technique:
    attack_id: T1059.002
    name: 'Command and Scripting Interpreter: AppleScript'
  platforms:
    darwin:
      sh:
        command: osascript -e 'do shell script "id"'
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - osascript
  - execution
  version: '1.0'
