- id: 61466e87-1a3f-54c8-90b9-b9b96ac7a7f8
  name: scp.exe - Loads a DLL from an absolute path or SMB path into child process
    `ssh.exe` by abusing the `PKCS11Provider` option. The payload executes upon DLL
    load (`DllMain`) and requires exporting `C_GetFunctionList` to prevent premature
    termination by `scp.exe`.
  description: Loads a DLL from an absolute path or SMB path into child process `ssh.exe`
