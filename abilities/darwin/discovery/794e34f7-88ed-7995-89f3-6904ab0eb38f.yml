- id: 794e34f7-88ed-7995-89f3-6904ab0eb38f
  name: notifyutil - Monitor login/logout events for privilege escalation timing
  description: By monitoring authentication-related notification keys, an attacker can detect login and
    logout events to time privilege escalation attempts or other malicious activities when defenses may
    be weakened during authentication transitions.
  tactic: discovery
  technique:
    attack_id: T1082
    name: System Information Discovery
  platforms:
