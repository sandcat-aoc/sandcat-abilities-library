- id: 09186a16-e7f1-4d26-9524-6999a95a2ea5
  name: Create EC2 Instance from Launch Template
  description: 'Creating and launching an instance using RunInstances, with a launch
    template.

    This launch template will contain all the necessary parameters for the instance.


    Reference for the launch templates

    https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/create-launch-template.html

    https://docs.aws.amazon.com/cli/latest/reference/ec2/run-instances.html#examples'
  tactic: defense-impairment
  technique:
    attack_id: T1578.002
    name: Create Cloud Instance
  platforms:
    linux:
      sh:
        command: 'if command -v aws > /dev/null 2>&1; then : ; else echo "Install
          AWS CLI: https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html";
          fi; aws ec2 create-launch-template \; --launch-template-name template.json
          \; --version-description 1 \; --tag-specifications ''ResourceType=launch-template,Tags=[{Key=purpose,Value=production}]''
          \; --launch-template-data file://template.json; aws ec2 run-instances --image-id
          ami-12345678 --instance-type tg4.nano \; --region us-east-1 --profile default'
        cleanup: 'aws ec2 terminate-instances  --instance-ids #{instance_id} \; --region  #{aws_region}
          --profile #{profile_name}'
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - defense-impairment
  - t1578.002
  author: Atomic Red Team
  additional_info:
    input_arguments:
      template_name:
        description: Full path to the template.json file
        type: string
        default: PathToAtomicsFolder/T1578.002/src/template.json
      version:
        description: Launch template version description
        type: string
        default: '1'
      ami_id:
        description: AMI ID to use
        type: string
        default: ami-12345678
      instance_type:
        description: EC2 instance type
        type: string
        default: tg4.nano
      instance_id:
        description: EC2 instance ID to terminate
        type: string
        default: i-1234567890abcdef0
      aws_region:
        description: AWS region
        type: string
        default: us-east-1
      profile_name:
        description: AWS profile name
        type: string
        default: default
    dependencies:
    - description: AWS CLI must be installed
      prereq_command: 'if command -v aws > /dev/null 2>&1; then exit 0; else exit
        1; fi

        '
      get_prereq_command: 'echo "Install AWS CLI: https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html"

        '
    technique_created: '2020-05-14T14:45:15.978Z'
    atomic_guid: 09186a16-e7f1-4d26-9524-6999a95a2ea5
    import_timestamp: '2026-09-01T07:13:15.887725Z'
