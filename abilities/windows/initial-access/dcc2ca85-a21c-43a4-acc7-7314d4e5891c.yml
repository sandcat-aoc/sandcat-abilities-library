- id: dcc2ca85-a21c-43a4-acc7-7314d4e5891c
  name: MITM Proxy Injection (Windows)
  description: Start mitmdump proxy with injection script in the background.
  tactic: initial-access
  technique:
    attack_id: T1659
    name: Content Injection
  platforms:
    windows:
      psh:
        command: 'if (Get-Command python -ErrorAction SilentlyContinue) { exit 0 }
          else { exit 1 }; then : ; else winget install --id Python.Python.3 -e; fi;
          if (Get-Command curl.exe -ErrorAction SilentlyContinue) { exit 0 } else
          { exit 1 }; then : ; else winget install --id cURL.cURL -e; fi; if (Get-Command
          mitmdump -ErrorAction SilentlyContinue) { exit 0 } else { exit 1 }; then
          : ; else python -m pip install mitmproxy; fi; $conn = Get-NetTCPConnection
          -LocalPort 8080 -State Listen -ErrorAction SilentlyContinue; if ($conn)
          {; $procId = $conn[0].OwningProcess; $cmd = (Get-CimInstance Win32_Process
          -Filter "ProcessId=$procId").CommandLine; if ($cmd -match "mitmdump") {
          exit 0 } else { exit 1 }; } else { exit 1 }; then : ; else $code = '''';
          [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($code))
          | Out-File -FilePath "$env:TEMP\atomic_t1659_inject.py" -Encoding ascii;
          Start-Process -FilePath "mitmdump" -ArgumentList @("-s", "$env:TEMP\atomic_t1659_inject.py",
          "-p", "8080") -RedirectStandardOutput "$env:TEMP\atomic_t1659.log" -RedirectStandardError
          "$env:TEMP\atomic_t1659_error.log" -WindowStyle Hidden; Start-Sleep -Seconds
          5; if (Get-NetTCPConnection -LocalPort 8080 -ErrorAction SilentlyContinue
          | Where-Object { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Name
          -like "*mitmdump*" }) { exit 0 } else { Get-Content "$env:TEMP\atomic_t1659.log";
          exit 1 }; fi; curl.exe -skI --proxy http://127.0.0.1:8080 http://example.com
          | Tee-Object -FilePath "$env:TEMP\curl_out.txt"; if (-not (Select-String
          -Path "$env:TEMP\curl_out.txt" -Pattern "X-Atomic")) { Write-Error "Header
          not found"; exit 1 }; $OutPath = "$env:TEMP\atomic_t1659_page.html"; curl.exe
          -sk --proxy http://127.0.0.1:8080 http://example.com | Out-File -FilePath
          $OutPath -Encoding utf8; $Content = Get-Content -Path $OutPath -Raw; if
          ($Content -notmatch "Atomic T1659 Injection") { exit 1 }'
        cleanup: Stop-Process -Name "mitmdump" -ErrorAction SilentlyContinue; Remove-Item
          "$env:TEMP\atomic_t1659_inject.py" -ErrorAction SilentlyContinue; Remove-Item
          "$env:TEMP\atomic_t1659.log" -ErrorAction SilentlyContinue; Remove-Item
          "$env:TEMP\curl_out.txt" -ErrorAction SilentlyContinue; Remove-Item "$env:TEMP\atomic_t1659_page.html"
          -ErrorAction SilentlyContinue
        elevation_required: false
  plugin: atomic
