- id: e0c5c285-8903-4927-a9f8-a7c37eac37e2
  name: Create EC2 Instance with user data
  description: 'Creates an EC2 instance with a keypair while passing user data in
    a script.

    The script runs at launch.'
  tactic: defense-impairment
  technique:
    attack_id: T1578.002
    name: Create Cloud Instance
  platforms:
    linux:
      sh:
        command: '# Description: AWS CLI must be installed.; if command -v aws > /dev/null
          2>&1; then : ; else echo "Install AWS CLI: https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html";
          fi; printf ''%s\n'' ''#!/bin/bash'' ''date -u > /var/tmp/userdata-ran.txt''
          > my_script.txt; aws ec2 run-instances \; --image-id ami-12345678 \; --instance-type
          tg4.nano \; --count 1 \; --subnet-id subnet-XXXXXXXXXXXXXXX \; --key-name
          MyKeyPair \; --user-data file://my_script.txt'
        cleanup: 'aws ec2 terminate-instances --instance-ids #{instance_id} \; --region  #{aws_region}
          --profile #{profile_name}'
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1578.002
  - defense-impairment
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      ami_id:
        description: AMI ID to use
        type: string
        default: ami-12345678
      instance_type:
        description: EC2 instance type
        type: string
        default: tg4.nano
      instance_id:
        description: EC2 instance ID to terminate
        type: string
        default: i-1234567890abcdef0
      aws_region:
        description: AWS region
        type: string
        default: us-west-2
      profile_name:
        description: AWS profile name
        type: string
        default: default
    dependencies:
    - description: AWS CLI must be installed
      prereq_command: '# Description: AWS CLI must be installed.

        if command -v aws > /dev/null 2>&1; then exit 0; else exit 1; fi'
      get_prereq_command: 'echo "Install AWS CLI: https://docs.aws.amazon.com/cli/latest/userguide/install-cliv2.html"

        '
