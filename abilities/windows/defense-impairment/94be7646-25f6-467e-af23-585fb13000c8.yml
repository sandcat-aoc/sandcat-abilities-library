  additional_info:
    input_arguments:
      direction:
        description: Direction can be Inbound or Outbound
        type: string
        default: Inbound
      local_port:
        description: This is the local port you wish to test opening
        type: integer
        default: 21
      protocol:
        description: This is the protocol
        type: string
        default: TCP
      action:
        description: This is the action
        type: string
        default: allow
