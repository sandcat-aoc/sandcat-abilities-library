      psh:
        command: $proc = Start-Process notepad.exe -PassThru; mavinject.exe $proc.Id
          /STARTAPP "$env:SystemRoot\System32\cmd.exe"; Write-Host "[+] Mavinject
          App-V STARTAPP execution simulated."
        cleanup: Stop-Process -Name notepad -Force -ErrorAction SilentlyContinue;
          Write-Host "[+] Cleaned up STARTAPP target processes."
        elevation_required: true
