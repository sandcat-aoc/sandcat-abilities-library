- id: ea096f52-c6f0-71cc-9c55-5b5cab8ee68e
  name: dsenableroot - Enable the root account interactively to keep credentials out of the command line
  description: 'With no arguments, dsenableroot prompts for the caller''s password and the new root password.
    Neither secret

    reaches argv, so they stay out of shell history and the process argument list, though the process
    name is still

    recorded. Requires an interactive TTY and an admin session.

    '
  tactic: persistence
  technique:
    attack_id: T1136.001
    name: 'Create Account: Local Account'
  platforms:
    darwin:
      sh:
        command: dsenableroot
  singleton: true
  privilege: User
  repeatable: false
  delete_payload: false
